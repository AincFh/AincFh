<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="AincFh OS interactive workspace: launch the full web desktop, project explorer, terminal and system settings">
<defs>
<style>
:root{--bg:#fafafa;--pane:#f5f2f3;--win:#f9f5f6;--ink:#23202e;--sub:#675f70;--line:#b9aab3;--hex:rgba(255,159,67,.2)}
@media(prefers-color-scheme:dark){:root{--bg:#1c1f2b;--pane:#222131;--win:#181924;--ink:#f4f1f4;--sub:#a9a5ba;--line:#4a4055;--hex:rgba(255,159,67,.17)}}
.t{font-family:Inter,'Segoe UI',-apple-system,'Noto Sans SC',Arial,sans-serif}.m{font-family:Consolas,'SFMono-Regular',monospace}
.spin{transform-origin:697px 187px;animation:rot 30s linear infinite}.spin2{transform-origin:697px 187px;animation:rot 22s linear infinite reverse}
.trace{animation:trace 9s linear infinite}.blink{animation:blink 2.1s steps(1) infinite}.pulse{animation:pulse 3.2s ease-in-out infinite}.slide{animation:slide 8s ease-in-out infinite alternate}
@keyframes rot{to{transform:rotate(360deg)}}@keyframes trace{to{stroke-dashoffset:-470}}@keyframes blink{50%{opacity:0}}@keyframes pulse{50%{opacity:.28}}@keyframes slide{to{transform:translateX(15px)}}
@media(prefers-reduced-motion:reduce){.spin,.spin2,.trace,.blink,.pulse,.slide{animation:none}}
</style>
<linearGradient id="brand" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#ff9f43"/><stop offset=".53" stop-color="#ff795d"/><stop offset="1" stop-color="#a477ed"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#ff9f43" stop-opacity=".19"/><stop offset="1" stop-color="#ff9f43" stop-opacity="0"/></radialGradient>
<linearGradient id="low" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff9f43" stop-opacity=".2"/><stop offset="1" stop-color="#9b77ef" stop-opacity=".05"/></linearGradient>
<pattern id="grid" width="69" height="60" patternUnits="userSpaceOnUse"><path d="m17 0 17 10v20L17 40 0 30V10ZM52 30l17 10v20L52 70 35 60V40Z" fill="none" stroke="var(--hex)" stroke-width=".8"/></pattern>
<clipPath id="clip"><rect width="900" height="360"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect width="900" height="360" fill="var(--bg)"/><rect width="900" height="360" fill="url(#grid)" opacity=".5"/><ellipse cx="710" cy="140" rx="300" ry="290" fill="url(#glow)"/><rect x="15" y="15" width="870" height="330" fill="var(--pane)" stroke="var(--line)" stroke-opacity=".6"/>
<path d="M25 33V25H33m834 0h8v8M25 327v8h8m834 0h8v-8" stroke="#9b77ef" stroke-width="1.8" fill="none"/>
<path d="M15 347H885" stroke="url(#brand)" stroke-width="4"/>
<circle cx="55" cy="54" r="4" fill="#61dcaa" class="pulse"/><text x="67" y="58" class="m" font-size="10" fill="#ff9f43" letter-spacing="2.3">LIVE PREVIEW / CLICK TO ENTER</text>
<text x="53" y="119" class="t" font-size="48" font-weight="800" fill="var(--ink)" letter-spacing="-2.5">AincFh<tspan fill="#ff9f43">_OS</tspan></text>
<text x="55" y="158" class="t" font-size="16" font-weight="700" fill="var(--ink)">A complete interactive workspace.</text>
<text x="55" y="189" class="t" font-size="12.5" fill="var(--sub)">项目窗口 / 动态桌面 / Command Center</text>
<text x="55" y="209" class="t" font-size="12.5" fill="var(--sub)">Terminal / 主题切换 / 多窗口操作</text>
<g class="slide"><rect x="54" y="236" width="227" height="52" rx="2" fill="url(#brand)"/><text x="76" y="268" class="t" font-size="13" font-weight="800" letter-spacing="1" fill="#151019">ENTER INTERACTIVE OS</text><path d="M248 263h16m-6-6 6 6-6 6" fill="none" stroke="#151019" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></g>
<text x="55" y="324" class="m" font-size="9.5" fill="var(--sub)" letter-spacing="1.4">ANIMATED SVG PREVIEW · FULL EXPERIENCE OPENS IN BROWSER</text>
<!-- Project window, drawn as original vector UI instead of a minified screenshot. -->
<g transform="translate(455 42)">
<rect width="402" height="264" rx="9" fill="var(--win)" stroke="#ff9f43" stroke-opacity=".6"/>
<rect width="402" height="36" rx="9" fill="url(#low)"/><path d="M0 36h402" stroke="var(--line)" stroke-opacity=".5"/>
<circle cx="18" cy="18" r="5" fill="#fa6866"/><circle cx="34" cy="18" r="5" fill="#f4c05d"/><circle cx="50" cy="18" r="5" fill="#4ece93"/>
<path d="m175 13 6 4v7l-6 4-6-4v-7z" stroke="#ff9f43" fill="none" stroke-width="1"/><text x="187" y="21" class="m" font-size="10" fill="var(--ink)" font-weight="700">PROJECT EXPLORER</text><text x="371" y="21" class="m" font-size="9" fill="#ff9f43">AF/01</text>
<text x="23" y="61" class="m" font-size="9" fill="#ff9f43" letter-spacing="1.7">SELECTED WORK / 01—04</text>
<rect x="20" y="70" width="98" height="27" fill="#ff9f43"/><text x="30" y="87" class="m" font-size="9" fill="#1b1620">01 / A.T. FIELD</text>
<rect x="124" y="70" width="118" height="27" fill="none" stroke="var(--line)"/><text x="134" y="87" class="m" font-size="9" fill="var(--sub)">02 / ST. LAURENT</text>
<rect x="248" y="70" width="125" height="27" fill="none" stroke="var(--line)"/><text x="258" y="87" class="m" font-size="9" fill="var(--sub)">03 / WINDOWS</text>
<text x="22" y="135" class="t" font-size="25" font-weight="800" fill="var(--ink)">Work that ships.</text>
<text x="23" y="153" class="t" font-size="10.5" fill="var(--sub)">Interfaces · Systems · Engineering</text>
<rect x="21" y="170" width="356" height="71" fill="url(#low)" stroke="var(--line)" stroke-opacity=".45"/>
<g class="spin" transform="translate(-455 -42)" fill="none" stroke="#ff9f43" stroke-opacity=".32" stroke-width="1.3"><polygon points="697,121 756,155 756,223 697,257 638,223 638,155"/><polygon points="697,137 742,163 742,215 697,241 652,215 652,163"/></g>
<path class="trace" d="M25 232V179H370" fill="none" stroke="#ff9f43" stroke-width="2" stroke-dasharray="6 470"/>
<path d="M41 191h123" stroke="#ff9f43" stroke-width="6"/><path d="M41 209h170M41 223h110" stroke="var(--line)" stroke-width="4"/>
<rect x="284" y="189" width="28" height="24" fill="#8b5cf6" fill-opacity=".35"/><rect x="318" y="189" width="28" height="24" fill="#8b5cf6" fill-opacity=".24"/>
</g>
<g class="spin2" fill="none" stroke="#9b77ef" stroke-opacity=".13"><polygon points="697,35 826,110 826,264 697,338 568,264 568,110"/></g>
</g></svg>
