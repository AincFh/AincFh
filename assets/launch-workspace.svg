<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="Animated AincFh OS demo: project window switches among A.T. Field, Saint Laurent, Windows Tools, and Terminal with an animated pointer in a repeating twenty-second tour.">
<defs><style>
:root{--bg:#2C3B4F;--pane:#3B4D64;--win:#26384E;--ink:#F5F7FC;--sub:#C8D5E5;--line:#6A7D96}

.t{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif}.mono{font-family:'SFMono-Regular',Consolas,monospace}

/* Continuous 20-second motion reel: four five-second chapters, crossfade without double exposure. */
.scene0{animation:scene0 20s linear infinite}.scene1{animation:scene1 20s linear infinite}.scene2{animation:scene2 20s linear infinite}.scene3{animation:scene3 20s linear infinite}
@keyframes scene0{0%,22.5%{opacity:1}24.2%,99%{opacity:0}100%{opacity:1}}
@keyframes scene1{0%,24.3%{opacity:0}26%,47.5%{opacity:1}49.2%,100%{opacity:0}}
@keyframes scene2{0%,49.3%{opacity:0}51%,72.5%{opacity:1}74.2%,100%{opacity:0}}
@keyframes scene3{0%,74.3%{opacity:0}76%,97.4%{opacity:1}98.8%,100%{opacity:0}}
.cursor{animation:cursor 20s ease-in-out infinite;transform-origin:0 0}
@keyframes cursor{0%,4%{transform:translate(516px,140px);opacity:0}10%,22%{transform:translate(516px,140px);opacity:1}25%{transform:translate(592px,140px);opacity:.45}27%,47%{transform:translate(592px,140px);opacity:1}50%{transform:translate(668px,140px);opacity:.45}52%,72%{transform:translate(668px,140px);opacity:1}75%{transform:translate(742px,140px);opacity:.45}77%,94%{transform:translate(742px,140px);opacity:1}98%,100%{transform:translate(742px,140px);opacity:0}}
.af-tour-progress{animation:af-tour-progress 20s linear infinite;transform-box:fill-box;transform-origin:left center}
.af-tour-pulse{animation:none}
.af-tour-slide{animation:none}
.af-tour-cta{animation:none}
@keyframes af-tour-progress{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes af-tour-pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes af-tour-slide{0%{transform:translateX(-12px);opacity:.07}100%{transform:translateX(20px);opacity:.16}}
@keyframes af-tour-cta{0%,100%{opacity:1}50%{opacity:.86}}

.float{animation:none}.glow{animation:none}.scan{animation:none}.trace{animation:none}.line{animation:none}.terminal-caret{animation:caret .7s steps(1) infinite}
@keyframes float{to{transform:translateY(-5px)}}@keyframes glow{50%{opacity:.22}}@keyframes scan{0%{transform:translateX(-380px);opacity:0}15%,83%{opacity:.025}100%{transform:translateX(420px);opacity:0}}@keyframes trace{to{stroke-dashoffset:-80}}@keyframes line{to{transform:scaleX(.58)}}@keyframes caret{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.scene0,.scene1,.scene2,.scene3,.cursor,.float,.glow,.scan,.trace,.line,.terminal-caret,.af-tour-progress,.af-tour-pulse,.af-tour-slide,.af-tour-cta{animation:none!important;transform:none!important}.scene0{opacity:1!important}.scene1,.scene2,.scene3,.cursor{opacity:0!important}}
</style>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A9C8F1"/><stop offset=".52" stop-color="#CDBCF0"/><stop offset="1" stop-color="#F2C5AB"/></linearGradient>
<linearGradient id="panegrad" x1="0" y1="0" x2="1"><stop stop-color="#F2C5AB" stop-opacity=".18"/><stop offset="1" stop-color="#CDBCF0" stop-opacity=".1"/></linearGradient>
<linearGradient id="linegrad"><stop stop-color="#A9C8F1"/><stop offset="1" stop-color="#966ff3"/></linearGradient>
<clipPath id="view"><rect x="0" y="0" width="900" height="360"/></clipPath>
<radialGradient id="studioAura"><stop stop-color="#91A8D9" stop-opacity=".19"/><stop offset="1" stop-color="#91A8D9" stop-opacity="0"/></radialGradient>
