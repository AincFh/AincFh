<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="Animated AincFh OS demo: project window switches among A.T. Field, Saint Laurent, Windows Tools, and Terminal with an animated pointer in a repeating twenty-second tour.">
<defs><style>
:root{--bg:#1c1f2b;--pane:#242232;--win:#171824;--ink:#f5f0f4;--sub:#b6aebe;--line:#55465a}
@media(prefers-color-scheme:light){:root{--bg:#f7f4f4;--pane:#eee9ee;--win:#fbf8fa;--ink:#231c2a;--sub:#675e71;--line:#bdb0ba}}
.t{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif}.mono{font-family:'SFMono-Regular',Consolas,monospace}
.cursor{animation:cursor 20s ease-in-out infinite;transform-origin:0 0}
@keyframes cursor{0%,12%{transform:translate(0,0);opacity:0}17%,21%{transform:translate(0,0);opacity:1}28%,45%{transform:translate(124px,0);opacity:1}51%,69%{transform:translate(240px,0);opacity:1}77%,93%{transform:translate(180px,180px);opacity:1}97%,100%{opacity:0;transform:translate(0,0)}}
.float{animation:float 5s ease-in-out infinite alternate}.glow{animation:glow 2.8s ease-in-out infinite}.scan{animation:scan 4.7s linear infinite}.trace{animation:trace 3s linear infinite}.line{animation:line 3s ease-in-out infinite alternate}.terminal-caret{animation:caret .7s steps(1) infinite}
@keyframes float{to{transform:translateY(-5px)}}@keyframes glow{50%{opacity:.22}}@keyframes scan{0%{transform:translateX(-380px);opacity:0}15%,83%{opacity:.025}100%{transform:translateX(420px);opacity:0}}@keyframes trace{to{stroke-dashoffset:-80}}@keyframes line{to{transform:scaleX(.58)}}@keyframes caret{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.cursor,.float,.glow,.scan,.trace,.line,.terminal-caret{animation:none!important}}.scene0{opacity:1}.scene1,.scene2,.scene3,.cursor{opacity:0}}
</style>
