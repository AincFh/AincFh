<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2C3B4F"/><stop offset=".56" stop-color="#35465C"/><stop offset="1" stop-color="#2B394C"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2=".4"><stop stop-color="#A9C8F1"/><stop offset=".52" stop-color="#CDBCF0"/><stop offset="1" stop-color="#F2C5AB"/></linearGradient>
