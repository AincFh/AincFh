<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" role="img" aria-label="Selected work — A.T. Field and Saint Laurent Systems">
<defs>
<style>
:root{--bg:#fafafa;--ink:#111111;--sub:#64748b;--dim:#94a3b8;--hexl:rgba(255,159,67,.26);--brk:#8b5cf6;--line:rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#1c1f2b;--ink:#f1f5f9;--sub:#94a3b8;--dim:#7c8ba3;--hexl:rgba(255,159,67,.17);--brk:#a78bfa;--line:rgba(255,255,255,.10)}}
.bg{fill:var(--bg)}.ink{fill:var(--ink)}.sub{fill:var(--sub)}.dim{fill:var(--dim)}
.hx{stroke:var(--hexl);fill:none;stroke-width:1}
.brk{stroke:var(--brk);fill:none;stroke-width:2}
.ln{stroke:var(--line);stroke-width:1}
.dsp{font-family:'Orbitron','Rajdhani','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
.txt{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif}
</style>
<linearGradient id="at" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FF9F43"/><stop offset="100%" stop-color="#FF6B6B"/></linearGradient>
<linearGradient id="pv" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#8B5CF6" stop-opacity=".9"/><stop offset="100%" stop-color="#8B5CF6" stop-opacity=".15"/></linearGradient>
<radialGradient id="o1"><stop offset="0%" stop-color="#FF9F43" stop-opacity=".26"/><stop offset="100%" stop-color="#FF9F43" stop-opacity="0"/></radialGradient>
<radialGradient id="o2"><stop offset="0%" stop-color="#8B5CF6" stop-opacity=".24"/><stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
<radialGradient id="mg" cx="94%" cy="14%" r="58%"><stop offset="0%" stop-color="#fff" stop-opacity="1"/><stop offset="50%" stop-color="#fff" stop-opacity=".4"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient>
<mask id="lm"><rect width="900" height="900" fill="url(#mg)"/></mask>
<pattern id="hexp" width="60" height="105" patternUnits="userSpaceOnUse">
<path class="hx" d="M30,0 L60,17.5 L60,52.5 L30,70 L0,52.5 L0,17.5 Z"/>
<path class="hx" d="M60,52.5 L90,70 L90,105 L60,122.5 L30,105 L30,70 Z"/>
<path class="hx" d="M0,52.5 L30,70 L30,105 L0,122.5 L-30,105 L-30,70 Z"/>
<path class="hx" d="M60,-52.5 L90,-35 L90,0 L60,17.5 L30,0 L30,-35 Z"/>
<path class="hx" d="M0,-52.5 L30,-35 L30,0 L0,17.5 L-30,0 L-30,-35 Z"/>
</pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect y="2" width="4" height="2" fill="#000" opacity=".2"/></pattern>
<filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
</defs>

<rect class="bg" width="900" height="900"/>

<ellipse cx="820" cy="110" rx="320" ry="250" fill="url(#o1)" opacity=".7">
<animate attributeName="rx" values="320;350;320" dur="9s" repeatCount="indefinite"/>
<animate attributeName="opacity" values=".7;.9;.7" dur="9s" repeatCount="indefinite"/>
</ellipse>
<ellipse cx="90" cy="780" rx="300" ry="240" fill="url(#o2)" opacity=".6">
<animate attributeName="rx" values="300;330;300" dur="12s" begin="3s" repeatCount="indefinite"/>
<animate attributeName="opacity" values=".6;.82;.6" dur="12s" begin="3s" repeatCount="indefinite"/>
</ellipse>

<rect width="900" height="900" fill="url(#hexp)" mask="url(#lm)"/>

<path d="M750,150 L825,20 L975,20 L1050,150 L975,280 L825,280 Z" fill="none" stroke="url(#at)" stroke-width="1.5" stroke-linejoin="round" opacity=".16">
<animate attributeName="opacity" values=".16;.30;.16" dur="12s" repeatCount="indefinite"/>
</path>

<text class="txt dim" x="60" y="52" font-size="10.5" font-weight="700" letter-spacing="3">A.T. FIELD  //  SELECTED WORK</text>

<g opacity="0">
<animate attributeName="opacity" from="0" to="1" dur=".9s" begin=".15s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" from="0 16" to="0 0" dur="1.1s" begin=".15s" calcMode="spline" keySplines=".2 .8 .2 1" fill="freeze"/>

<text class="dsp" x="60" y="114" font-size="34" font-weight="700" fill="#FF9F43" opacity=".85">01</text>
<text class="dsp ink" x="118" y="104" font-size="18" font-weight="700" letter-spacing=".5">A.T. FIELD</text>
<text class="txt" x="840" y="104" font-size="12" font-weight="600" text-anchor="end" fill="#FF6B6B">aincfh.dpdns.org</text>
<text class="txt sub" x="118" y="130" font-size="12.5">絶対領域 — a content platform I own end to end, from the schema to the DNS record.</text>

<g class="txt dim" font-size="10" font-weight="700" letter-spacing="1.6">
<text x="118" y="170">FRONTEND</text>
<text x="118" y="192">EDGE</text>
<text x="118" y="214">CONTENT</text>
<text x="118" y="236">MOBILE</text>
<text x="118" y="258">COST</text>
</g>
<g class="txt sub" font-size="12.5">
<text x="232" y="170">React Router v7 · TypeScript · Tailwind v4 · Framer Motion</text>
<text x="232" y="192">Cloudflare Workers · D1 · R2 · KV</text>
<text x="232" y="214">Notion as CMS, cached in KV behind a 5-minute TTL</text>
<text x="232" y="236">13 runtime guards that strip weight on slow connections</text>
<text x="232" y="258" fill="#FF9F43" font-weight="600">¥0 / month, in production</text>
</g>

<text class="txt" x="118" y="300" font-size="10" font-weight="700" letter-spacing="2.4" fill="#FF9F43">THREE PROBLEMS I CAN STILL EXPLAIN FROM MEMORY</text>

<g fill="#FF9F43" opacity=".8">
<path d="M121.5,326 L123.8,322 L128.2,322 L130.5,326 L128.2,330 L123.8,330 Z"/>
<path d="M121.5,398 L123.8,394 L128.2,394 L130.5,398 L128.2,402 L123.8,402 Z"/>
<path d="M121.5,470 L123.8,466 L128.2,466 L130.5,470 L128.2,474 L123.8,474 Z"/>
</g>
<g class="txt ink" font-size="13" font-weight="600">
<text x="142" y="330">bcrypt does not exist on Workers.</text>
<text x="142" y="402">Double-charging under concurrent callbacks.</text>
<text x="142" y="474">Fine locally, slow in production.</text>
</g>
<g class="txt sub" font-size="12.5">
<text x="142" y="350">The V8 edge runtime has no Node crypto bindings, so password hashing was</text>
<text x="142" y="368">rewritten on Web Crypto — PBKDF2 with a per-user salt.</text>
<text x="142" y="422">Payment confirmation was not idempotent. Fixed with a lock acquired before</text>
<text x="142" y="440">any state mutation, keyed on the order id.</text>
<text x="142" y="494">The article table needed composite indexes across publish date, category and</text>
<text x="142" y="512">status. Local SQLite hid the cost; D1 did not.</text>
</g>

<line class="ln" x1="60" y1="548" x2="840" y2="548"/>
</g>

<g opacity="0">
<animate attributeName="opacity" from="0" to="1" dur=".9s" begin=".5s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" from="0 18" to="0 0" dur="1.1s" begin=".5s" calcMode="spline" keySplines=".2 .8 .2 1" fill="freeze"/>

<text class="dsp" x="60" y="602" font-size="34" font-weight="700" fill="#8B5CF6" opacity=".85">02</text>
<text class="dsp ink" x="118" y="592" font-size="18" font-weight="700" letter-spacing=".5">SAINT LAURENT SYSTEMS</text>
<text class="txt dim" x="840" y="592" font-size="12" font-weight="600" text-anchor="end">8 departments · 60+ releases</text>
<text class="txt sub" x="118" y="618" font-size="12.5">Eight-plus internal tools for a community's public-service departments.</text>
<text class="txt sub" x="118" y="636" font-size="12.5">Zero dependencies, plain HTML/CSS/JS, one file each, fully functional offline.</text>

<g fill="#8B5CF6" opacity=".8">
<path d="M121.5,666 L123.8,662 L128.2,662 L130.5,666 L128.2,670 L123.8,670 Z"/>
<path d="M121.5,712 L123.8,708 L128.2,708 L130.5,712 L128.2,716 L123.8,716 Z"/>
<path d="M121.5,758 L123.8,754 L128.2,754 L130.5,758 L128.2,762 L123.8,762 Z"/>
</g>
<g class="txt sub" font-size="12.5">
<text x="142" y="670">A legal code browser over 24 chapters and 345 provisions, with mixed Chinese</text>
<text x="142" y="688">and pinyin-initial search — space for AND, pipe for OR</text>
<text x="142" y="716">A sentencing calculator: six reduction tiers, fine-to-time conversion and</text>
<text x="142" y="734">stacked caps</text>
<text x="142" y="762">A shared frontend template reused across departments — inherited at v2.0.2,</text>
<text x="142" y="780">carried to v4.59</text>
</g>

<rect x="118" y="806" width="2" height="60" fill="url(#pv)"/>
<g class="txt dim" font-size="12" font-style="italic">
<text x="142" y="824">These were built for Saint Laurent 2.0, an online roleplay community where I run</text>
<text x="142" y="842">the justice department. The systems are real software; the institution they serve</text>
<text x="142" y="860">is fictional.</text>
</g>
</g>

<g class="brk">
<path d="M16,30 L16,16 L30,16"/>
<path d="M870,16 L884,16 L884,30"/>
<path d="M16,870 L16,884 L30,884"/>
<path d="M870,884 L884,884 L884,870"/>
</g>

<rect width="900" height="900" fill="url(#scan)" opacity=".1"/>
<rect width="900" height="900" filter="url(#noise)" opacity=".03"/>
</svg>
