<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-label="AincFh OS, a unified six-scene animated showcase of web products, fictional FiveM roleplay systems, Windows desktop tools, engineering principles, and contact.">
<defs><style><![CDATA[
html{color-scheme:dark}
.scene,.selected{animation-duration:36s;animation-iteration-count:infinite;animation-timing-function:linear}
.scene0,.selected0{animation-name:scene0}
.scene1,.selected1{animation-name:scene1}
.scene2,.selected2{animation-name:scene2}
.scene3,.selected3{animation-name:scene3}
.scene4,.selected4{animation-name:scene4}
.scene5,.selected5{animation-name:scene5}
@keyframes scene0{0%,15.0%{opacity:1}16.6%,98.7%{opacity:0}100%{opacity:1}}
@keyframes scene1{0%,15.17%{opacity:0}16.87%,31.83%{opacity:1}33.53%,100%{opacity:0}}
@keyframes scene2{0%,31.83%{opacity:0}33.53%,48.50%{opacity:1}50.20%,100%{opacity:0}}
@keyframes scene3{0%,48.50%{opacity:0}50.20%,65.17%{opacity:1}66.87%,100%{opacity:0}}
@keyframes scene4{0%,65.17%{opacity:0}66.87%,81.83%{opacity:1}83.53%,100%{opacity:0}}
@keyframes scene5{0%,81.6%{opacity:0}83.3%,98.3%{opacity:1}100%{opacity:0}}

.progress{animation:progress 36s linear infinite;transform-box:fill-box;transform-origin:left center}
@keyframes progress{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.cursor{animation:cursor 36s ease-in-out infinite;transform-origin:0 0}
@keyframes cursor{0%,1%{opacity:0;transform:translate(538px,188px)}3%,15.1%{opacity:1;transform:translate(538px,188px)}17%,31.6%{opacity:1;transform:translate(647px,188px)}33.3%,48.3%{opacity:1;transform:translate(756px,188px)}50%,65%{opacity:1;transform:translate(865px,188px)}66.7%,81.6%{opacity:1;transform:translate(974px,188px)}83.3%,98.3%{opacity:1;transform:translate(1083px,188px)}100%{opacity:0;transform:translate(1083px,188px)}}
.click-ring{animation:click-ring 36s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes click-ring{0%{opacity:0;transform:scale(.5)}2.70%{opacity:0;transform:scale(.5)} 3.40%{opacity:.8;transform:scale(.85)} 4.30%{opacity:0;transform:scale(1.4)} 17.00%{opacity:0;transform:scale(.5)} 17.70%{opacity:.8;transform:scale(.85)} 18.60%{opacity:0;transform:scale(1.4)} 33.70%{opacity:0;transform:scale(.5)} 34.40%{opacity:.8;transform:scale(.85)} 35.30%{opacity:0;transform:scale(1.4)} 50.40%{opacity:0;transform:scale(.5)} 51.10%{opacity:.8;transform:scale(.85)} 52.00%{opacity:0;transform:scale(1.4)} 67.10%{opacity:0;transform:scale(.5)} 67.80%{opacity:.8;transform:scale(.85)} 68.70%{opacity:0;transform:scale(1.4)} 83.70%{opacity:0;transform:scale(.5)} 84.40%{opacity:.8;transform:scale(.85)} 85.30%{opacity:0;transform:scale(1.4)}100%{opacity:0;transform:scale(.5)}}
.float{animation:float 6s ease-in-out infinite alternate}@keyframes float{to{transform:translateY(-4px)}}
.pulse{animation:pulse 3s ease-in-out infinite}@keyframes pulse{50%{opacity:.37}}
.scan{animation:scan 7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:left center}@keyframes scan{to{transform:scaleX(.5)}}
@media(prefers-reduced-motion:reduce){.scene,.selected,.progress,.cursor,.click-ring,.float,.pulse,.scan{animation:none!important;transform:none!important}.scene0,.selected0{opacity:1!important}.scene1,.scene2,.scene3,.scene4,.scene5,.selected1,.selected2,.selected3,.selected4,.selected5{opacity:0!important}.cursor,.click-ring{opacity:0!important}}
]]></style>
