<text x="330" y="171" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="14" font-weight="675" fill="#CDBCF0" >Web</text><text x="383" y="171" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="14" font-weight="550" fill="#F5F7FC" >aincfh.dpdns.org</text>
