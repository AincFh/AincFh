<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120" role="img" aria-label="End of line">
  <defs>
    <style>
      :root{--bg:#f2f2f7;--sub:#86868b;--glass:rgba(255,255,255,.55);--gedge:rgba(255,255,255,.92);--grid:rgba(0,0,0,.05);--dot:#c7c7cc}
      @media (prefers-color-scheme:dark){:root{--bg:#0a0a0c;--sub:#8e8e93;--glass:rgba(32,32,36,.52);--gedge:rgba(255,255,255,.18);--grid:rgba(255,255,255,.055);--dot:#48484a}}
      .bg{fill:var(--bg)}.sub{fill:var(--sub)}.dot{fill:var(--dot)}
      .glass{fill:var(--glass)}.gedge{stroke:var(--gedge);fill:none}
      .gl{stroke:var(--grid);stroke-width:1;fill:none}
      .t{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
    </style>

    <radialGradient id="f1"><stop offset="0%" stop-color="#af52de" stop-opacity=".34"/><stop offset="100%" stop-color="#af52de" stop-opacity="0"/></radialGradient>
    <radialGradient id="f2"><stop offset="0%" stop-color="#007aff" stop-opacity=".32"/><stop offset="100%" stop-color="#007aff" stop-opacity="0"/></radialGradient>
    <radialGradient id="f3"><stop offset="0%" stop-color="#ff9500" stop-opacity=".22"/><stop offset="100%" stop-color="#ff9500" stop-opacity="0"/></radialGradient>

    <pattern id="fgrid" width="30" height="30" patternUnits="userSpaceOnUse"><path class="gl" d="M30 0 L0 0 0 30"/></pattern>
    <filter id="fblur" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="fgrain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>

    <g id="fbd">
      <rect class="bg" width="900" height="120"/>
      <ellipse cx="180" cy="120" rx="300" ry="150" fill="url(#f1)"/>
      <ellipse cx="720" cy="115" rx="300" ry="150" fill="url(#f2)"/>
      <ellipse cx="450" cy="0"   rx="340" ry="110" fill="url(#f3)"/>
      <rect width="900" height="120" fill="url(#fgrid)"/>
    </g>

    <clipPath id="fwc">
      <path d="M0,120 L900,120 L900,50 Q450,-30 0,50 Z">
        <animate attributeName="d"
          values="M0,120 L900,120 L900,50 Q450,-30 0,50 Z;
                  M0,120 L900,120 L900,28 Q450,-8 0,72 Z;
                  M0,120 L900,120 L900,72 Q450,-8 0,28 Z;
                  M0,120 L900,120 L900,50 Q450,-30 0,50 Z"
          dur="14s" repeatCount="indefinite"/>
      </path>
    </clipPath>
  </defs>

  <use href="#fbd"/>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.2s" fill="freeze"/>
    <g clip-path="url(#fwc)">
      <use href="#fbd" filter="url(#fblur)"/>
      <rect class="glass" width="900" height="120"/>
    </g>
    <path class="gedge" stroke-width="1.2" d="M900,50 Q450,-30 0,50">
      <animate attributeName="d"
        values="M900,50 Q450,-30 0,50;
                M900,28 Q450,-8 0,72;
                M900,72 Q450,-8 0,28;
                M900,50 Q450,-30 0,50"
        dur="14s" repeatCount="indefinite"/>
    </path>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.45s" fill="freeze"/>
    <circle class="dot" cx="450" cy="72" r="3">
      <animate attributeName="opacity" values="1;.2;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text class="t sub" x="450" y="99" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="2.5">END OF LINE</text>
  </g>

  <rect width="900" height="120" filter="url(#fgrain)" opacity=".045"/>
</svg>
