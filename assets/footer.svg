<text x="448" y="110" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="25" font-weight="730" fill="#F5F7FC" text-anchor="middle">破灭的宿命亦是重生的喜悦</text>
<text x="450" y="138" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="14" font-weight="520" fill="#C8D5E5" text-anchor="middle">Destruction is the joy of rebirth.</text>
