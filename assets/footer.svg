<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150" role="img" aria-label="Destruction is the joy of rebirth">
<defs>
<style>
:root{--bg:#fafafa;--ink:#111111;--sub:#64748b;--dim:#94a3b8;--hexl:rgba(255,159,67,.26);--brk:#8b5cf6}
@media (prefers-color-scheme:dark){:root{--bg:#1c1f2b;--ink:#f1f5f9;--sub:#94a3b8;--dim:#7c8ba3;--hexl:rgba(255,159,67,.17);--brk:#a78bfa}}
.bg{fill:var(--bg)}.ink{fill:var(--ink)}.sub{fill:var(--sub)}.dim{fill:var(--dim)}
.hx{stroke:var(--hexl);fill:none;stroke-width:1}
.brk{stroke:var(--brk);fill:none;stroke-width:2}
.txt{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans SC','Helvetica Neue',Arial,sans-serif}
</style>
<linearGradient id="at" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FF9F43"/><stop offset="100%" stop-color="#FF6B6B"/></linearGradient>
<radialGradient id="o1"><stop offset="0%" stop-color="#FF9F43" stop-opacity=".30"/><stop offset="100%" stop-color="#FF9F43" stop-opacity="0"/></radialGradient>
<radialGradient id="o2"><stop offset="0%" stop-color="#8B5CF6" stop-opacity=".22"/><stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
<radialGradient id="mg" cx="50%" cy="28%" r="52%"><stop offset="0%" stop-color="#fff" stop-opacity=".9"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient>
<mask id="lm"><rect width="900" height="150" fill="url(#mg)"/></mask>
<pattern id="hexp" width="60" height="105" patternUnits="userSpaceOnUse">
<path class="hx" d="M30,0 L60,17.5 L60,52.5 L30,70 L0,52.5 L0,17.5 Z"/>
<path class="hx" d="M60,52.5 L90,70 L90,105 L60,122.5 L30,105 L30,70 Z"/>
<path class="hx" d="M0,52.5 L30,70 L30,105 L0,122.5 L-30,105 L-30,70 Z"/>
<path class="hx" d="M60,-52.5 L90,-35 L90,0 L60,17.5 L30,0 L30,-35 Z"/>
<path class="hx" d="M0,-52.5 L30,-35 L30,0 L0,17.5 L-30,0 L-30,-35 Z"/>
</pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect y="2" width="4" height="2" fill="#000" opacity=".2"/></pattern>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
</defs>

<rect class="bg" width="900" height="150"/>
<ellipse cx="450" cy="20" rx="340" ry="140" fill="url(#o1)" opacity=".7">
<animate attributeName="rx" values="340;374;340" dur="8s" repeatCount="indefinite"/>
<animate attributeName="opacity" values=".7;.9;.7" dur="8s" repeatCount="indefinite"/>
</ellipse>
<ellipse cx="180" cy="150" rx="280" ry="120" fill="url(#o2)" opacity=".5">
<animate attributeName="opacity" values=".5;.7;.5" dur="12s" begin="4s" repeatCount="indefinite"/>
</ellipse>
<rect width="900" height="150" fill="url(#hexp)" mask="url(#lm)"/>

<g stroke-linejoin="round">
<path d="M348,33 L359,39.5 L359,52.5 L348,59 L337,52.5 L337,39.5 Z" fill="none" stroke="#FF9F43" stroke-width="1.2" opacity=".25"><animate attributeName="opacity" values=".25;.6;.25" dur="6s" begin="0s" repeatCount="indefinite"/></path>
<path d="M382,33 L393,39.5 L393,52.5 L382,59 L371,52.5 L371,39.5 Z" fill="none" stroke="#FF9F43" stroke-width="1.2" opacity=".35"><animate attributeName="opacity" values=".35;.75;.35" dur="6s" begin=".5s" repeatCount="indefinite"/></path>
<path d="M416,33 L427,39.5 L427,52.5 L416,59 L405,52.5 L405,39.5 Z" fill="none" stroke="#FF9F43" stroke-width="1.4" opacity=".55"><animate attributeName="opacity" values=".55;.95;.55" dur="6s" begin="1s" repeatCount="indefinite"/></path>
<g filter="url(#glow)"><path d="M450,31 L463,38.5 L463,53.5 L450,61 L437,53.5 L437,38.5 Z" fill="url(#at)"><animate attributeName="opacity" values="1;.55;1" dur="6s" begin="1.5s" repeatCount="indefinite"/></path></g>
<path d="M484,33 L495,39.5 L495,52.5 L484,59 L473,52.5 L473,39.5 Z" fill="none" stroke="#FF6B6B" stroke-width="1.4" opacity=".55"><animate attributeName="opacity" values=".55;.95;.55" dur="6s" begin="1s" repeatCount="indefinite"/></path>
<path d="M518,33 L529,39.5 L529,52.5 L518,59 L507,52.5 L507,39.5 Z" fill="none" stroke="#FF6B6B" stroke-width="1.2" opacity=".35"><animate attributeName="opacity" values=".35;.75;.35" dur="6s" begin=".5s" repeatCount="indefinite"/></path>
<path d="M552,33 L563,39.5 L563,52.5 L552,59 L541,52.5 L541,39.5 Z" fill="none" stroke="#8B5CF6" stroke-width="1.2" opacity=".25"><animate attributeName="opacity" values=".25;.6;.25" dur="6s" begin="0s" repeatCount="indefinite"/></path>
</g>

<g opacity="0">
<animate attributeName="opacity" from="0" to="1" dur=".9s" begin=".4s" fill="freeze"/>
<text class="txt ink" x="450" y="95" text-anchor="middle" font-size="14" font-weight="600" letter-spacing="1.5">破灭的宿命亦是重生的喜悦</text>
<text class="txt sub" x="450" y="115" text-anchor="middle" font-size="11" font-style="italic">Destruction is the joy of rebirth.  ·  I alone level up.</text>
<text class="txt dim" x="450" y="137" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="2.6">AincFh  ·  aincfh.dpdns.org</text>
</g>

<g class="brk">
<path d="M16,26 L16,12 L30,12"/>
<path d="M870,12 L884,12 L884,26"/>
<path d="M16,124 L16,138 L30,138"/>
<path d="M870,138 L884,138 L884,124"/>
</g>

<rect width="900" height="150" fill="url(#scan)" opacity=".1"/>
<rect width="900" height="150" filter="url(#noise)" opacity=".03"/>
</svg>
