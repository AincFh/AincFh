<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Destruction is the joy of rebirth — contact">
<defs>
<style>
:root{--bg:#fafafa;--ink:#111111;--sub:#64748b;--dim:#94a3b8;--hexl:rgba(255,159,67,.26);--brk:#8b5cf6;--line:rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#1c1f2b;--ink:#f1f5f9;--sub:#94a3b8;--dim:#7c8ba3;--hexl:rgba(255,159,67,.17);--brk:#a78bfa;--line:rgba(255,255,255,.10)}}
.bg{fill:var(--bg)}.ink{fill:var(--ink)}.sub{fill:var(--sub)}.dim{fill:var(--dim)}
.hx{stroke:var(--hexl);fill:none;stroke-width:1}
.brk{stroke:var(--brk);fill:none;stroke-width:2}
.ln{stroke:var(--line);stroke-width:1}
.dsp{font-family:'Orbitron','Rajdhani','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
.txt{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif}
</style>
<linearGradient id="at" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FF9F43"/><stop offset="100%" stop-color="#FF6B6B"/></linearGradient>
<radialGradient id="o1"><stop offset="0%" stop-color="#FF9F43" stop-opacity=".24"/><stop offset="100%" stop-color="#FF9F43" stop-opacity="0"/></radialGradient>
<radialGradient id="mg" cx="50%" cy="22%" r="52%"><stop offset="0%" stop-color="#fff" stop-opacity=".9"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient>
<mask id="lm"><rect width="900" height="260" fill="url(#mg)"/></mask>
<pattern id="hexp" width="60" height="105" patternUnits="userSpaceOnUse">
<path class="hx" d="M30,0 L60,17.5 L60,52.5 L30,70 L0,52.5 L0,17.5 Z"/>
<path class="hx" d="M60,52.5 L90,70 L90,105 L60,122.5 L30,105 L30,70 Z"/>
<path class="hx" d="M0,52.5 L30,70 L30,105 L0,122.5 L-30,105 L-30,70 Z"/>
<path class="hx" d="M60,-52.5 L90,-35 L90,0 L60,17.5 L30,0 L30,-35 Z"/>
<path class="hx" d="M0,-52.5 L30,-35 L30,0 L0,17.5 L-30,0 L-30,-35 Z"/>
</pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect y="2" width="4" height="2" fill="#000" opacity=".2"/></pattern>
<filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect class="bg" width="900" height="260"/>

<ellipse cx="450" cy="56" rx="300" ry="120" fill="url(#o1)" opacity=".7">
<animate attributeName="rx" values="300;336;300" dur="8s" repeatCount="indefinite"/>
<animate attributeName="opacity" values=".7;.92;.7" dur="8s" repeatCount="indefinite"/>
</ellipse>

<rect width="900" height="260" fill="url(#hexp)" mask="url(#lm)"/>

<g fill="none" stroke-width="1.4" stroke-linejoin="round">
<path d="M242,56 L253,37 L275,37 L286,56 L275,75 L253,75 Z" stroke="#8B5CF6" opacity=".18"><animate attributeName="opacity" values=".18;.34;.18" dur="6s" begin="1.8s" repeatCount="indefinite"/></path>
<path d="M304,56 L315,37 L337,37 L348,56 L337,75 L315,75 Z" stroke="#FF6B6B" opacity=".34"><animate attributeName="opacity" values=".34;.6;.34" dur="6s" begin="1.2s" repeatCount="indefinite"/></path>
<path d="M366,56 L377,37 L399,37 L410,56 L399,75 L377,75 Z" stroke="#FF9F43" opacity=".55"><animate attributeName="opacity" values=".55;.85;.55" dur="6s" begin=".6s" repeatCount="indefinite"/></path>
<path d="M490,56 L501,37 L523,37 L534,56 L523,75 L501,75 Z" stroke="#FF9F43" opacity=".55"><animate attributeName="opacity" values=".55;.85;.55" dur="6s" begin=".6s" repeatCount="indefinite"/></path>
<path d="M552,56 L563,37 L585,37 L596,56 L585,75 L563,75 Z" stroke="#FF6B6B" opacity=".34"><animate attributeName="opacity" values=".34;.6;.34" dur="6s" begin="1.2s" repeatCount="indefinite"/></path>
<path d="M614,56 L625,37 L647,37 L658,56 L647,75 L625,75 Z" stroke="#8B5CF6" opacity=".18"><animate attributeName="opacity" values=".18;.34;.18" dur="6s" begin="1.8s" repeatCount="indefinite"/></path>
</g>
<path d="M428,56 L439,37 L461,37 L472,56 L461,75 L439,75 Z" fill="url(#at)" filter="url(#glow)" opacity=".95">
<animate attributeName="opacity" values=".95;.65;.95" dur="6s" repeatCount="indefinite"/>
</path>

<text class="txt ink" x="450" y="126" font-size="17" font-weight="600" text-anchor="middle" letter-spacing="1.5">破灭的宿命亦是重生的喜悦</text>
<text class="txt dim" x="450" y="150" font-size="11" font-weight="500" text-anchor="middle" letter-spacing="1.6">Destruction is the joy of rebirth.  ·  I alone level up.</text>

<line class="ln" x1="60" y1="182" x2="840" y2="182"/>

<text class="txt" x="450" y="216" font-size="12.5" font-weight="600" text-anchor="middle" letter-spacing=".4"><tspan fill="#FF9F43">aincfh.dpdns.org</tspan><tspan class="dim">     ·     </tspan><tspan class="sub">fhainc@hotmail.com</tspan><tspan class="dim">     ·     </tspan><tspan fill="#FB7299">space.bilibili.com/527018775</tspan></text>

<text class="txt dim" x="60" y="244" font-size="10" font-weight="600" letter-spacing="2.2">AI-AUGMENTED  ·  HUMAN-REVIEWED</text>
<text class="txt dim" x="840" y="244" font-size="10" font-weight="600" letter-spacing="2.2" text-anchor="end">MADE IN XIAMEN, CN</text>

<g class="brk">
<path d="M16,30 L16,16 L30,16"/>
<path d="M870,16 L884,16 L884,30"/>
<path d="M16,230 L16,244 L30,244"/>
<path d="M870,244 L884,244 L884,230"/>
</g>

<rect width="900" height="260" fill="url(#scan)" opacity=".1"/>
<rect width="900" height="260" filter="url(#noise)" opacity=".03"/>
</svg>
