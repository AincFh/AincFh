<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="AincFh contact panel with Chinese personal motto, GitHub, website and email"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101727"/><stop offset=".55" stop-color="#192238"/><stop offset="1" stop-color="#111a2c"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2=".4"><stop stop-color="#ffb66b"/><stop offset=".5" stop-color="#df8b99"/><stop offset="1" stop-color="#aa95f0"/></linearGradient>
<radialGradient id="aura"><stop stop-color="#8f79d7" stop-opacity=".20"/><stop offset="1" stop-color="#8f79d7" stop-opacity="0"/></radialGradient>
<radialGradient id="warm"><stop stop-color="#f29a5c" stop-opacity=".12"/><stop offset="1" stop-color="#f29a5c" stop-opacity="0"/></radialGradient>
</defs><style><![CDATA[
.breathe{animation:breathe 11s ease-in-out infinite alternate;transform-origin:center}
@keyframes breathe{from{opacity:.53}to{opacity:1}}
.float{animation:float 8s ease-in-out infinite alternate}
@keyframes float{to{transform:translateY(-5px)}}
.soft-pulse{animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{opacity:.38}}
.scan{animation:scan 12s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:left center}
@keyframes scan{to{transform:scaleX(.55)}}
.shine{animation:shine 14s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:left center}
@keyframes shine{to{opacity:.5;transform:scaleX(.72)}}

@media(prefers-reduced-motion:reduce){.breathe,.float,.scan,.shine,.soft-pulse,.card-a,.card-b{animation:none!important;transform:none!important}}
]]></style>
<rect x="0" y="0" width="900" height="220" rx="0" fill="url(#bg)" stroke="none"/>
<ellipse class="breathe" cx="780" cy="42" rx="280" ry="230" fill="url(#aura)"/>
<ellipse class="breathe" cx="80" cy="195" rx="195" ry="145" fill="url(#warm)"/>
<path d="M38 27h26 M38 27v22 M835 193h26v-22" fill="none" stroke="#776f9a" stroke-width="1.6" opacity=".65"/>

<text x="51" y="51" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="12" font-weight="790" fill="#FFBE79" letter-spacing="1.5">AINCFH / CONNECT</text>
<text x="448" y="110" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="25" font-weight="730" fill="#F5F3FA" text-anchor="middle">破灭的宿命亦是重生的喜悦</text>
<text x="450" y="138" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="14" font-weight="520" fill="#AFBED5" text-anchor="middle">Destruction is the joy of rebirth.</text>
<path d="M51 161H849" fill="none" stroke="#465671" stroke-width="1"/>
<text x="57" y="192" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="11" font-weight="745" fill="#FFB979">GITHUB</text><text x="124" y="192" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="13" font-weight="660" fill="#DBE5F5">AincFh</text>
<text x="344" y="192" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="11" font-weight="745" fill="#C4ABFA">WEB</text><text x="392" y="192" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="13" font-weight="620" fill="#DBE5F5">aincfh.dpdns.org</text>
<text x="653" y="192" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="11" font-weight="745" fill="#88E9C8">EMAIL</text><text x="713" y="192" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="13" font-weight="620" fill="#DBE5F5">fhainc@hotmail.com</text>
