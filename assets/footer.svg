<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 235" width="900" height="235" role="img" aria-label="AincFh contact: aincfh.dpdns.org, fhainc@hotmail.com, and GitHub AincFh">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101522"/><stop offset=".55" stop-color="#182135"/><stop offset="1" stop-color="#111727"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2=".4"><stop stop-color="#ffad53"/><stop offset=".5" stop-color="#fd816b"/><stop offset="1" stop-color="#a481f4"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#253047"/><stop offset="1" stop-color="#192336"/></linearGradient>
<radialGradient id="light"><stop stop-color="#995be6" stop-opacity=".24"/><stop offset="1" stop-color="#995be6" stop-opacity="0"/></radialGradient>
<radialGradient id="warm"><stop stop-color="#f29447" stop-opacity=".14"/><stop offset="1" stop-color="#f29447" stop-opacity="0"/></radialGradient>
<pattern id="hex" width="86" height="74" patternUnits="userSpaceOnUse"><path d="M21 1 42 13v25L21 50 0 38V13ZM64 38 85 50v24L64 86 43 74V50Z" fill="none" stroke="#ffa455" stroke-opacity=".09" stroke-width="1"/></pattern>
<style><![CDATA[
/* Motion system 15.0: readable at every frame; pure CSS in embedded SVG. */
.af-halo{animation:af-halo 14s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.af-scan-line{animation:af-scan 9s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.af-led{animation:af-led 2.5s ease-in-out infinite}
.af-float{animation:af-float 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.af-title{animation:af-title 11s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.af-card{transform-box:fill-box;transform-origin:center;animation:af-card 12s ease-in-out infinite}
.af-card-1{animation-delay:0s}.af-card-2{animation-delay:-4s}.af-card-3{animation-delay:-8s}
.af-underline{animation:af-underline 12s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.af-blink{animation:af-blink 2.8s ease-in-out infinite}
.af-comet{animation:af-comet 11s linear infinite}
@keyframes af-halo{0%{opacity:.12;transform:translate(-24px,5px) scale(.96)}50%{opacity:.35}100%{opacity:.15;transform:translate(24px,-8px) scale(1.09)}}
@keyframes af-scan{0%,8%{transform:scaleX(.08);opacity:.30}65%{transform:scaleX(1);opacity:.88}88%,100%{transform:scaleX(.08);opacity:.3}}
@keyframes af-led{0%,100%{opacity:.48}50%{opacity:1}}
@keyframes af-float{0%,100%{transform:translateY(0px)}45%,60%{transform:translateY(-4px)}}
@keyframes af-title{0%,100%{opacity:1;transform:translateY(0)}6%{opacity:.75;transform:translateY(3px)}15%,94%{opacity:1;transform:translateY(0)}}
@keyframes af-card{0%,100%{transform:translateY(0);opacity:1}13%,28%{transform:translateY(-4px);opacity:1}35%{transform:translateY(0);opacity:1}}
@keyframes af-underline{0%,100%{transform:scaleX(.15);opacity:.45}45%{transform:scaleX(1);opacity:1}85%{transform:scaleX(.25);opacity:.6}}
@keyframes af-blink{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes af-comet{0%{transform:translateX(0);opacity:0}8%{opacity:1}90%{opacity:1}100%{transform:translateX(760px);opacity:0}}
@media(prefers-reduced-motion:reduce){.af-halo,.af-scan-line,.af-led,.af-float,.af-title,.af-card,.af-underline,.af-blink,.af-comet{animation:none!important;transform:none!important}}
]]></style>
</defs>
<g font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
<rect x="0" y="0" width="900" height="235" rx="0" fill="url(#bg)" stroke="none" stroke-width="1"/><rect x="0" y="0" width="900" height="235" rx="0" fill="url(#hex)" stroke="none" stroke-width="1"/>
<ellipse cx="800" cy="45" rx="345" ry="240" fill="url(#light)"/>
<ellipse cx="85" cy="175" rx="250" ry="200" fill="url(#warm)"/>
<g aria-hidden="true"><ellipse class="af-halo" cx="730" cy="73" rx="155" ry="95" fill="#9b82ed" opacity=".11"/><ellipse class="af-halo" cx="110" cy="165" rx="115" ry="110" fill="#fa965a" opacity=".10"/></g>

<rect x="18" y="18" width="864" height="199" rx="12" fill="none" stroke="#3a4059" stroke-width="1"/>
<path d="M38 35h24M38 35v23 M838 200h24v-23" fill="none" stroke="#b78afb" stroke-width="2"/>
<path class="af-blink" d="M18 215H882" stroke="url(#accent)" stroke-width="3"/>
<text x="50" y="61" fill="#ffb267" font-size="11" font-weight="770" letter-spacing="1.9">AINCFH  /  CONNECT</text><text class="af-title" x="450" y="110" fill="#f3f2f8" font-size="22" font-weight="720" text-anchor="middle">破灭的宿命亦是重生的喜悦</text><text class="af-blink" x="450" y="139" fill="#aabbd4" font-size="13" font-weight="520" text-anchor="middle">Destruction is the joy of rebirth.</text><path d="M65 159H835" stroke="#37435d" stroke-width="1"/><circle class="af-comet" cx="65" cy="159" r="4" fill="#ffb069"/><circle class="af-comet" cx="65" cy="159" r="11" fill="#ffb069" opacity=".10"/><text x="69" y="190" fill="#ffb167" font-size="9" font-weight="790" letter-spacing="1.5">WEB</text><text x="111" y="190" fill="#d7e1f0" font-size="12" font-weight="600" >aincfh.dpdns.org</text><text x="357" y="190" fill="#ffb167" font-size="9" font-weight="790" letter-spacing="1.5">EMAIL</text><text x="410" y="190" fill="#d7e1f0" font-size="12" font-weight="600" >fhainc@hotmail.com</text><text x="674" y="190" fill="#ffb167" font-size="9" font-weight="790" letter-spacing="1.5">GITHUB</text><text x="738" y="190" fill="#d7e1f0" font-size="12" font-weight="680" >AincFh</text>
</g></svg>