<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="3200" viewBox="0 0 1000 3200" role="img" aria-label="AincFh — a single continuous Apple-inspired portfolio. Large readable product windows for A.T. Field, Saint Laurent fictional FiveM services, Windows desktop tools, software engineering and contact.">
<defs><style><![CDATA[:root{color-scheme:light}
.float{animation:float 7s ease-in-out infinite alternate}@keyframes float{to{transform:translateY(-9px)}}
.pulse{animation:pulse 3s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}
.scan{animation:scan 5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:left center}@keyframes scan{to{transform:scaleX(.57)}}
.cardA{animation:cardA 10s ease-in-out infinite}.cardB{animation:cardB 10s ease-in-out infinite}
@keyframes cardA{0%,43%{opacity:1}50%,93%{opacity:0}100%{opacity:1}}
@keyframes cardB{0%,43%{opacity:0}50%,93%{opacity:1}100%{opacity:0}}
.queryA{animation:cardA 12s ease-in-out infinite}.queryB{animation:cardB 12s ease-in-out infinite}
.wave-line{stroke-dasharray:28 10;animation:traverse 5s linear infinite}@keyframes traverse{to{stroke-dashoffset:-130}}
.progress{animation:progress 12s linear infinite;transform-box:fill-box;transform-origin:left center}@keyframes progress{from{transform:scaleX(.03)}to{transform:scaleX(1)}}
@media(prefers-reduced-motion:reduce){.float,.pulse,.scan,.cardA,.cardB,.queryA,.queryB,.wave-line,.progress{animation:none!important;transform:none!important}.cardB,.queryB{opacity:0!important}.cardA,.queryA{opacity:1!important}}
]]></style>
<linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf4fd"/><stop offset=".39" stop-color="#f8f5fe"/><stop offset=".72" stop-color="#edf6fd"/><stop offset="1" stop-color="#f3f5fb"/></linearGradient>
<linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d2e4ff"/><stop offset=".53" stop-color="#e0e0ff"/><stop offset="1" stop-color="#ffebe3"/></linearGradient>
<linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#48a6ff"/><stop offset="1" stop-color="#4e74e5"/></linearGradient>
<linearGradient id="lilac" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b8d0fa"/><stop offset=".5" stop-color="#d6ccfa"/><stop offset="1" stop-color="#f0cddd"/></linearGradient>
<linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2f83eb"/><stop offset=".58" stop-color="#9992dd"/><stop offset="1" stop-color="#a9c9ed"/></linearGradient>
<radialGradient id="aura"><stop stop-color="#b0cdf5" stop-opacity=".38"/><stop offset="1" stop-color="#b0cdf5" stop-opacity="0"/></radialGradient>
