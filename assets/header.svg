<text x="54" y="124" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="71" font-weight="820" fill="#F5F7FC" letter-spacing="-3.8">AincFh</text>
<text x="307" y="123" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="70" font-weight="780" fill="#CDBCF0" letter-spacing="-3.7">OS.</text>
<text x="58" y="163" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="22" font-weight="640" fill="#F5F7FC" >Design. Build. Refine.</text>
<text x="59" y="193" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="14" font-weight="510" fill="#C8D5E5" >Web platforms   /   Desktop software   /   AI tools</text>
<rect x="659" y="45" width="155" height="155" rx="33" fill="#40516A" stroke="#7385A1"/>
<rect x="675" y="61" width="123" height="123" rx="26" fill="url(#icon)" stroke="none"/>
<path d="M703 142L737 98L769 142 M722 126H751" stroke="#415E87" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
