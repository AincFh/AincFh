<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="AincFh — A.T. Field">
<defs>
<style>
:root{--bg:#fafafa;--ink:#111111;--sub:#64748b;--hexl:rgba(255,159,67,.30);--brk:#8b5cf6;--rule:rgba(255,159,67,.45)}
@media (prefers-color-scheme:dark){:root{--bg:#1c1f2b;--ink:#f1f5f9;--sub:#94a3b8;--hexl:rgba(255,159,67,.20);--brk:#a78bfa;--rule:rgba(255,159,67,.38)}}
.bg{fill:var(--bg)}.ink{fill:var(--ink)}.sub{fill:var(--sub)}
.hx{stroke:var(--hexl);fill:none;stroke-width:1}
.brk{stroke:var(--brk);fill:none;stroke-width:2}
.rule{stroke:var(--rule);stroke-width:1}
.dsp{font-family:'Orbitron','Rajdhani','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
.txt{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans SC','Helvetica Neue',Arial,sans-serif}
</style>
<linearGradient id="at" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FF9F43"/><stop offset="100%" stop-color="#FF6B6B"/></linearGradient>
<radialGradient id="o1"><stop offset="0%" stop-color="#FF9F43" stop-opacity=".40"/><stop offset="100%" stop-color="#FF9F43" stop-opacity="0"/></radialGradient>
<radialGradient id="o2"><stop offset="0%" stop-color="#FF6B6B" stop-opacity=".34"/><stop offset="100%" stop-color="#FF6B6B" stop-opacity="0"/></radialGradient>
<radialGradient id="o3"><stop offset="0%" stop-color="#8B5CF6" stop-opacity=".26"/><stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
<radialGradient id="mg" cx="17%" cy="50%" r="64%"><stop offset="0%" stop-color="#fff" stop-opacity="1"/><stop offset="45%" stop-color="#fff" stop-opacity=".5"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient>
<mask id="lm"><rect width="900" height="240" fill="url(#mg)"/></mask>
<pattern id="hexp" width="60" height="105" patternUnits="userSpaceOnUse">
<path class="hx" d="M30,0 L60,17.5 L60,52.5 L30,70 L0,52.5 L0,17.5 Z"/>
<path class="hx" d="M60,52.5 L90,70 L90,105 L60,122.5 L30,105 L30,70 Z"/>
<path class="hx" d="M0,52.5 L30,70 L30,105 L0,122.5 L-30,105 L-30,70 Z"/>
<path class="hx" d="M60,-52.5 L90,-35 L90,0 L60,17.5 L30,0 L30,-35 Z"/>
<path class="hx" d="M0,-52.5 L30,-35 L30,0 L0,17.5 L-30,0 L-30,-35 Z"/>
</pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect y="2" width="4" height="2" fill="#000" opacity=".2"/></pattern>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
</defs>

<rect class="bg" width="900" height="240"/>

<ellipse cx="150" cy="120" rx="250" ry="200" fill="url(#o1)" opacity=".7">
<animate attributeName="rx" values="250;275;250" dur="8s" repeatCount="indefinite"/>
<animate attributeName="opacity" values=".7;.9;.7" dur="8s" repeatCount="indefinite"/>
</ellipse>
<ellipse cx="690" cy="20" rx="280" ry="170" fill="url(#o2)" opacity=".6">
<animate attributeName="rx" values="280;294;280" dur="10s" begin="2s" repeatCount="indefinite"/>
<animate attributeName="opacity" values=".6;.8;.6" dur="10s" begin="2s" repeatCount="indefinite"/>
</ellipse>
<ellipse cx="560" cy="250" rx="300" ry="150" fill="url(#o3)" opacity=".5">
<animate attributeName="rx" values="300;345;300" dur="12s" begin="4s" repeatCount="indefinite"/>
<animate attributeName="opacity" values=".5;.7;.5" dur="12s" begin="4s" repeatCount="indefinite"/>
</ellipse>

<rect width="900" height="240" fill="url(#hexp)" mask="url(#lm)"/>

<g filter="url(#glow)">
<path d="M150,48 L212,84 L212,156 L150,192 L88,156 L88,84 Z" fill="none" stroke="url(#at)" stroke-width="3" stroke-linejoin="round" stroke-dasharray="432" stroke-dashoffset="432">
<animate attributeName="stroke-dashoffset" from="432" to="0" dur="1.8s" begin=".2s" fill="freeze" calcMode="spline" keySplines=".25 1 .5 1"/>
</path>
</g>
<path d="M150,84 L181,102 L181,138 L150,156 L119,138 L119,102 Z" fill="none" stroke="#FF9F43" stroke-width="1.4" stroke-linejoin="round" opacity="0">
<animate attributeName="opacity" values="0;.9" dur="1s" begin="1.4s" fill="freeze"/>
<animate attributeName="opacity" values=".9;.35;.9" dur="8s" begin="2.4s" repeatCount="indefinite"/>
</path>
<path d="M150,105 L163,112.5 L163,127.5 L150,135 L137,127.5 L137,112.5 Z" fill="url(#at)" opacity="0">
<animate attributeName="opacity" values="0;1" dur=".8s" begin="1.8s" fill="freeze"/>
<animate attributeName="opacity" values="1;.5;1" dur="6s" begin="2.6s" repeatCount="indefinite"/>
</path>

<g opacity="0">
<animate attributeName="opacity" from="0" to="1" dur=".9s" begin=".7s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" from="14 0" to="0 0" dur="1.1s" begin=".7s" calcMode="spline" keySplines=".2 .8 .2 1" fill="freeze"/>
<text class="dsp ink" x="280" y="110" font-size="58" font-weight="700" letter-spacing="1.5">AincFh</text>
<text class="txt" x="282" y="140" font-size="12" font-weight="700" letter-spacing="4.5" fill="#FF9F43">A.T. FIELD  //  絶対領域</text>
<line class="rule" x1="282" y1="160" x2="720" y2="160"/>
<text class="txt sub" x="282" y="181" font-size="11" font-weight="600" letter-spacing="2.2">FRONTEND  ·  EDGE  ·  XIAMEN, CN</text>
<text class="txt" x="282" y="203" font-size="12.5" font-weight="600" fill="#FF6B6B">aincfh.dpdns.org</text>
</g>

<g class="brk">
<path d="M16,30 L16,16 L30,16"/>
<path d="M870,16 L884,16 L884,30"/>
<path d="M16,210 L16,224 L30,224"/>
<path d="M870,224 L884,224 L884,210"/>
</g>

<rect width="900" height="240" fill="url(#scan)" opacity=".1"/>
<rect width="900" height="240" filter="url(#noise)" opacity=".03"/>
</svg>
