<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">AincFh — Full-stack products, developer tools, and AI systems</title>
  <desc id="desc">A dark, minimal editorial banner with subtle blue and violet lighting and a stylized systems diagram. AincFh builds thoughtful software across web, desktop, and AI.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
