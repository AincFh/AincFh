<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="AincFh — frontend and edge developer, Xiamen China">
<defs>
<style>
:root{--bg:#fafafa;--ink:#111111;--sub:#64748b;--dim:#94a3b8;--hexl:rgba(255,159,67,.26);--brk:#8b5cf6;--line:rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#1c1f2b;--ink:#f1f5f9;--sub:#94a3b8;--dim:#7c8ba3;--hexl:rgba(255,159,67,.17);--brk:#a78bfa;--line:rgba(255,255,255,.10)}}
.bg{fill:var(--bg)}.ink{fill:var(--ink)}.sub{fill:var(--sub)}.dim{fill:var(--dim)}
.hx{stroke:var(--hexl);fill:none;stroke-width:1}
.brk{stroke:var(--brk);fill:none;stroke-width:2}
.ln{stroke:var(--line);stroke-width:1}
.dsp{font-family:'Orbitron','Rajdhani','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
.txt{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans SC','Helvetica Neue',Arial,sans-serif}
</style>
<linearGradient id="at" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FF9F43"/><stop offset="100%" stop-color="#FF6B6B"/></linearGradient>
<radialGradient id="o1"><stop offset="0%" stop-color="#FF9F43" stop-opacity=".34"/><stop offset="100%" stop-color="#FF9F43" stop-opacity="0"/></radialGradient>
<radialGradient id="o2"><stop offset="0%" stop-color="#FF6B6B" stop-opacity=".30"/><stop offset="100%" stop-color="#FF6B6B" stop-opacity="0"/></radialGradient>
<radialGradient id="o3"><stop offset="0%" stop-color="#8B5CF6" stop-opacity=".24"/><stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
<radialGradient id="mg" cx="92%" cy="52%" r="58%"><stop offset="0%" stop-color="#fff" stop-opacity="1"/><stop offset="50%" stop-color="#fff" stop-opacity=".45"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient>
<mask id="lm"><rect width="900" height="560" fill="url(#mg)"/></mask>
<pattern id="hexp" width="60" height="105" patternUnits="userSpaceOnUse">
<path class="hx" d="M30,0 L60,17.5 L60,52.5 L30,70 L0,52.5 L0,17.5 Z"/>
<path class="hx" d="M60,52.5 L90,70 L90,105 L60,122.5 L30,105 L30,70 Z"/>
<path class="hx" d="M0,52.5 L30,70 L30,105 L0,122.5 L-30,105 L-30,70 Z"/>
<path class="hx" d="M60,-52.5 L90,-35 L90,0 L60,17.5 L30,0 L30,-35 Z"/>
<path class="hx" d="M0,-52.5 L30,-35 L30,0 L0,17.5 L-30,0 L-30,-35 Z"/>
</pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect y="2" width="4" height="2" fill="#000" opacity=".2"/></pattern>
<filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
</defs>

<rect class="bg" width="900" height="560"/>

<ellipse cx="120" cy="90" rx="320" ry="240" fill="url(#o1)" opacity=".7">
<animate attributeName="rx" values="320;352;320" dur="8s" repeatCount="indefinite"/>
<animate attributeName="opacity" values=".7;.9;.7" dur="8s" repeatCount="indefinite"/>
</ellipse>
<ellipse cx="830" cy="520" rx="300" ry="230" fill="url(#o2)" opacity=".6">
<animate attributeName="rx" values="300;315;300" dur="10s" begin="2s" repeatCount="indefinite"/>
<animate attributeName="opacity" values=".6;.8;.6" dur="10s" begin="2s" repeatCount="indefinite"/>
</ellipse>
<ellipse cx="760" cy="60" rx="280" ry="200" fill="url(#o3)" opacity=".5">
<animate attributeName="rx" values="280;322;280" dur="12s" begin="4s" repeatCount="indefinite"/>
<animate attributeName="opacity" values=".5;.7;.5" dur="12s" begin="4s" repeatCount="indefinite"/>
</ellipse>

<rect width="900" height="560" fill="url(#hexp)" mask="url(#lm)"/>

<path d="M880,114 L1040,207 L1040,393 L880,486 L720,393 L720,207 Z" fill="none" stroke="url(#at)" stroke-width="1.5" stroke-linejoin="round" opacity=".16">
<animate attributeName="opacity" values=".16;.30;.16" dur="12s" repeatCount="indefinite"/>
</path>

<g opacity="0">
<animate attributeName="opacity" from="0" to="1" dur=".9s" begin=".1s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" from="0 16" to="0 0" dur="1.1s" begin=".1s" calcMode="spline" keySplines=".2 .8 .2 1" fill="freeze"/>

<text class="txt dim" x="60" y="50" font-size="10.5" font-weight="700" letter-spacing="3">A.T. FIELD  //  PROFILE</text>

<text class="dsp ink" x="60" y="100" font-size="42" font-weight="700" letter-spacing="1">AincFh</text>
<text class="txt sub" x="60" y="126" font-size="14" font-weight="500">前端 / 全栈开发 · 从艺术设计转工程</text>
<text class="txt dim" x="60" y="148" font-size="11" font-weight="600" letter-spacing="2.2">FRONTEND / EDGE  ·  XIAMEN, CN  ·  19</text>

<circle cx="680" cy="90" r="4" fill="#34d399"><animate attributeName="opacity" values="1;.3;1" dur="3s" repeatCount="indefinite"/></circle>
<text class="txt" x="840" y="94" font-size="11" font-weight="700" letter-spacing="2" text-anchor="end" fill="#34d399">AVAILABLE FOR WORK</text>
<circle cx="716" cy="120" r="4" fill="#FF9F43"/>
<text class="txt sub" x="840" y="124" font-size="11" font-weight="600" letter-spacing="2" text-anchor="end">OPEN TO REMOTE</text>
<circle cx="744" cy="148" r="4" fill="#8B5CF6"/>
<text class="txt dim" x="840" y="152" font-size="11" font-weight="600" letter-spacing="2" text-anchor="end">UTC+8  ·  ¥0 / MO</text>

<line class="ln" x1="60" y1="176" x2="840" y2="176"/>

<text class="txt ink" x="60" y="210" font-size="14">Building at the intersection of edge computing and obsessive interface</text>
<text class="txt ink" x="60" y="232" font-size="14">precision. Everything I ship runs on the edge, costs nothing, and</text>
<text class="txt ink" x="60" y="254" font-size="14">works offline.</text>
<text class="txt sub" x="60" y="282" font-size="13">在边缘计算与界面精度的交汇处做产品。从艺术设计转前端工程，</text>
<text class="txt sub" x="60" y="304" font-size="13">做离线优先、零服务器成本的 Web 应用。</text>

<line class="ln" x1="60" y1="330" x2="840" y2="330"/>
</g>

<g opacity="0">
<animate attributeName="opacity" from="0" to="1" dur=".8s" begin=".45s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" from="0 18" to="0 0" dur="1s" begin=".45s" calcMode="spline" keySplines=".2 .8 .2 1" fill="freeze"/>

<text class="dsp" x="60" y="386" font-size="32" font-weight="700" fill="#FF9F43" opacity=".85">01</text>
<text class="dsp ink" x="116" y="376" font-size="17" font-weight="700" letter-spacing=".5">A.T. FIELD</text>
<text class="txt" x="840" y="376" font-size="12" font-weight="600" text-anchor="end" fill="#FF6B6B">aincfh.dpdns.org</text>
<text class="txt sub" x="116" y="398" font-size="12.5">React Router v7 · TypeScript · Tailwind v4 · Cloudflare Workers · D1 · R2 · KV</text>
<text class="txt dim" x="116" y="417" font-size="12.5">¥0 / month in production · offline-first · 13 runtime guards for slow mobile</text>

<text class="dsp" x="60" y="470" font-size="32" font-weight="700" fill="#8B5CF6" opacity=".85">02</text>
<text class="dsp ink" x="116" y="460" font-size="17" font-weight="700" letter-spacing=".5">SAINT LAURENT SYSTEMS</text>
<text class="txt dim" x="840" y="460" font-size="12" font-weight="600" text-anchor="end">8 departments · 60+ releases</text>
<text class="txt sub" x="116" y="482" font-size="12.5">Zero-dependency single-file HTML · 24 chapters / 345 provisions · sentencing calculator</text>
<text class="txt dim" x="116" y="501" font-size="12.5">Inherited a legacy codebase at v2.0.2 and carried it to v4.59</text>

<line class="ln" x1="60" y1="524" x2="840" y2="524"/>
<text class="txt dim" x="60" y="546" font-size="10.5" font-weight="600" letter-spacing="2.4">AI-AUGMENTED  ·  HUMAN-REVIEWED</text>
<text class="txt dim" x="840" y="546" font-size="10.5" font-weight="600" letter-spacing="2.4" text-anchor="end">BLUE LOCK  ·  SOLO LEVELING</text>
</g>

<g class="brk">
<path d="M16,30 L16,16 L30,16"/>
<path d="M870,16 L884,16 L884,30"/>
<path d="M16,530 L16,544 L30,544"/>
<path d="M870,544 L884,544 L884,530"/>
</g>

<rect width="900" height="560" fill="url(#scan)" opacity=".1"/>
<rect width="900" height="560" filter="url(#noise)" opacity=".03"/>
</svg>
