<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="AincFh profile overview with three clean animated cards for web, desktop and AI workflows"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101927"/><stop offset=".56" stop-color="#1A273B"/><stop offset="1" stop-color="#111C2E"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2=".4"><stop stop-color="#95B9EC"/><stop offset=".52" stop-color="#B8A9E6"/><stop offset="1" stop-color="#F0B58F"/></linearGradient>
<radialGradient id="aura"><stop stop-color="#91A8D9" stop-opacity=".15"/><stop offset="1" stop-color="#91A8D9" stop-opacity="0"/></radialGradient>
<radialGradient id="warm"><stop stop-color="#EBB495" stop-opacity=".12"/><stop offset="1" stop-color="#EBB495" stop-opacity="0"/></radialGradient>
</defs><style><![CDATA[
.breathe{animation:breathe 11s ease-in-out infinite alternate;transform-origin:center}
@keyframes breathe{from{opacity:.53}to{opacity:1}}
.float{animation:float 8s ease-in-out infinite alternate}
@keyframes float{to{transform:translateY(-5px)}}
.soft-pulse{animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{opacity:.38}}
.scan{animation:scan 12s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:left center}
@keyframes scan{to{transform:scaleX(.55)}}
.shine{animation:shine 14s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:left center}
@keyframes shine{to{opacity:.5;transform:scaleX(.72)}}

@media(prefers-reduced-motion:reduce){.breathe,.float,.scan,.shine,.soft-pulse,.card-a,.card-b{animation:none!important;transform:none!important}}
]]></style>
<rect x="0" y="0" width="900" height="420" rx="0" fill="url(#bg)" stroke="none"/>
<ellipse class="breathe" cx="780" cy="42" rx="280" ry="230" fill="url(#aura)"/>
<ellipse class="breathe" cx="80" cy="395" rx="195" ry="145" fill="url(#warm)"/>


