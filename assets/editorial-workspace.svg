<text x="509" y="278" class="brand-ink" font-size="13" font-weight="760" >CODEX / LOOKUP</text>
<rect x="510" y="292" width="265" height="34" rx="9" class="surface" /><text x="524" y="313" class="muted" font-size="13" font-weight="540" >Search laws and community rules…</text>
