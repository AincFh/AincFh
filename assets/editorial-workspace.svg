<radialGradient id="glassAura"><stop offset="0" stop-color="#9ec7ff" stop-opacity=".59"/><stop offset=".55" stop-color="#b4b3f4" stop-opacity=".31"/><stop offset="1" stop-color="#a9d8ff" stop-opacity="0"/></radialGradient>
<linearGradient id="glassPrism" x1="0" y1="0" x2="1" y2=".75"><stop offset="0" stop-color="#ffffff" stop-opacity=".45"/><stop offset=".28" stop-color="#a5d3ff" stop-opacity=".20"/><stop offset=".65" stop-color="#d2b8eb" stop-opacity=".18"/><stop offset="1" stop-color="#ffffff" stop-opacity=".28"/></linearGradient>
