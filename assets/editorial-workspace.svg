<svg xmlns="http://www.w3.org/2000/svg" width="900" height="552" viewBox="0 0 900 552" role="img" aria-label="AincFh project explorer: one large macOS-inspired application window, four readable product scenes that switch automatically every six seconds."><defs><style><![CDATA[
:root{--bg:#f1f4f9;--surface:#ffffff;--subtle:#e8edf5;--ink:#1d293b;--muted:#61728a;--line:#d7dfec;--brand:#2877d5;--brandText:#ffffff;--pale:#dbe8fa;--softBlue:#b9d2f6;--softLilac:#d5cced;--softMint:#b9e6d8;--uiShadow:#b4c5d9;--warm:#f6e9e1}
@media(prefers-color-scheme:dark){:root{--bg:#1d2736;--surface:#283547;--subtle:#334357;--ink:#f1f5fc;--muted:#b0c1d6;--line:#4a5b70;--brand:#97beff;--brandText:#1e3048;--pale:#3c5475;--softBlue:#55769d;--softLilac:#6e638b;--softMint:#4e7c71;--uiShadow:#0e1620;--warm:#5b5060}}
svg{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif}
.bg{fill:var(--bg)}.surface{fill:var(--surface)}.subtle{fill:var(--subtle)}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.brand-ink{fill:var(--brand)}.brand-bg{fill:var(--brand)}.pale{fill:var(--pale)}.blue{fill:var(--softBlue)}.lilac{fill:var(--softLilac)}.mint{fill:var(--softMint)}.warm{fill:var(--warm)}.pill{fill:var(--subtle)}
.stroke{stroke:var(--line)}.line{fill:var(--line)}.brand-stroke{stroke:var(--brand)}.brand-on{fill:var(--brandText)}
.soft-shadow{filter:url(#shadow)}
.chap,.tab-active{animation-duration:24s;animation-timing-function:linear;animation-iteration-count:infinite}
.chap0,.tab0{animation-name:show0}.chap1,.tab1{animation-name:show1}.chap2,.tab2{animation-name:show2}.chap3,.tab3{animation-name:show3}
@keyframes show0{0%,22.5%{opacity:1}24.7%,98%{opacity:0}100%{opacity:1}}
@keyframes show1{0%,24.8%{opacity:0}26.7%,47.5%{opacity:1}49.7%,100%{opacity:0}}
@keyframes show2{0%,49.8%{opacity:0}51.7%,72.5%{opacity:1}74.7%,100%{opacity:0}}
@keyframes show3{0%,74.8%{opacity:0}76.7%,97.5%{opacity:1}99.8%,100%{opacity:0}}
.progress{animation:progress 24s linear infinite;transform-box:fill-box;transform-origin:left center}
@keyframes progress{0%{transform:scaleX(.03)}100%{transform:scaleX(1)}}
.float{animation:float 11s ease-in-out infinite alternate}@keyframes float{to{transform:translateY(-5px)}}
.glow{animation:glow 9s ease-in-out infinite alternate}@keyframes glow{to{opacity:.5}}
.slide{animation:slide 12s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:left center}
@keyframes slide{to{transform:scaleX(.6)}}
@media(prefers-reduced-motion:reduce){.chap,.tab-active,.progress,.float,.glow,.slide{animation:none!important;transform:none!important}.chap0,.tab0{opacity:1!important}.chap1,.chap2,.chap3,.tab1,.tab2,.tab3{opacity:0!important}}

/* Editorial Liquid Glass: functional glass above solid readable content. */
:root{--glassTint:rgba(255,255,255,.60);--glassThin:rgba(255,255,255,.42);--glassBorder:rgba(255,255,255,.82);--glassRim:rgba(63,102,154,.23);--glassInk:#315f95}
@media(prefers-color-scheme:dark){:root{--glassTint:rgba(129,157,193,.20);--glassThin:rgba(165,190,215,.11);--glassBorder:rgba(239,248,255,.30);--glassRim:rgba(19,28,47,.58);--glassInk:#b6d5ff}}
.glass-surface{fill:var(--glassTint);stroke:var(--glassBorder);stroke-width:1.35;backdrop-filter:blur(12px) saturate(145%);-webkit-backdrop-filter:blur(12px) saturate(145%)}
.glass-thin{fill:var(--glassThin);stroke:var(--glassBorder);stroke-width:1;backdrop-filter:blur(8px) saturate(120%);-webkit-backdrop-filter:blur(8px) saturate(120%)}
.glass-selected{fill:var(--glassTint);stroke:var(--brand);stroke-width:1.1;backdrop-filter:blur(10px) saturate(130%);-webkit-backdrop-filter:blur(10px) saturate(130%)}
.glass-glint{fill:none;stroke:url(#glassEdge);stroke-width:1.7;stroke-linecap:round}
.glass-rim{fill:none;stroke:var(--glassRim);stroke-width:1.8}
.glass-light{fill:var(--glassInk)}
.glass-orb{opacity:.25;animation:glass-orb 16s ease-in-out infinite alternate}
.glass-spark{opacity:.72;animation:glass-spark 8s ease-in-out infinite alternate}
@keyframes glass-orb{to{transform:translate(9px,-7px);opacity:.38}}
@keyframes glass-spark{to{opacity:.32}}
@media(prefers-reduced-motion:reduce){.glass-orb,.glass-spark{animation:none!important;transform:none!important}}
@media(prefers-contrast:more){.glass-surface,.glass-thin,.glass-selected{fill:var(--surface);stroke:var(--brand)}}

]]></style><filter id="shadow" x="-25%" y="-25%" width="150%" height="180%"><feDropShadow dx="0" dy="9" stdDeviation="14" flood-color="#162d48" flood-opacity=".13"/></filter><clipPath id="content"><rect x="57" y="217" width="786" height="266" rx="12"/></clipPath>
