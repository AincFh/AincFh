<text x="80" y="253" class="brand-ink" font-size="13" font-weight="720" letter-spacing="1">04 / DEVELOPER WORKFLOW</text>
<text x="78" y="303" class="ink" font-size="39" font-weight="760" letter-spacing="-1.4">Build and verify.</text>
<text x="81" y="333" class="muted" font-size="15" font-weight="550" >A repeatable path from product idea to release.</text>
<rect x="81" y="357" width="75" height="29" rx="15" class="pill" /><text x="93" y="376" class="muted" font-size="12" font-weight="650" >Build</text><rect x="165" y="357" width="84" height="29" rx="15" class="pill" /><text x="177" y="376" class="muted" font-size="12" font-weight="650" >Review</text><rect x="258" y="357" width="72" height="29" rx="15" class="pill" /><text x="270" y="376" class="muted" font-size="12" font-weight="650" >Test</text>
