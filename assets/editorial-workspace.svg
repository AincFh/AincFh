<rect x="517" y="375" width="111" height="47" rx="10" class="pale" /><rect x="640" y="375" width="120" height="47" rx="10" class="surface" />
<text x="535" y="404" class="ink" font-size="15" font-weight="650" >Stories</text><text x="655" y="404" class="muted" font-size="15" font-weight="620" >Community</text>
</g><g class="chap chap1" opacity="0" clip-path="url(#content)">
<text x="80" y="253" class="brand-ink" font-size="13" font-weight="720" letter-spacing="1">02 / ROLEPLAY SERVICES</text>
<text x="78" y="303" class="ink" font-size="39" font-weight="775" letter-spacing="-1.6">Saint Laurent</text>
<text x="81" y="333" class="muted" font-size="15" font-weight="545" >Structured services for a fictional FiveM community.</text>
<rect x="81" y="357" width="124" height="29" rx="15" class="pill" /><text x="93" y="376" class="muted" font-size="12" font-weight="650" >Public codex</text><rect x="216" y="357" width="137" height="29" rx="15" class="pill" /><text x="228" y="376" class="muted" font-size="12" font-weight="650" >Authorized tools</text>
