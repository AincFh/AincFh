<text x="80" y="253" class="brand-ink" font-size="13" font-weight="720" letter-spacing="1.1">01 / WEB PRODUCT</text>
<text x="78" y="304" class="ink" font-size="42" font-weight="775" letter-spacing="-1.6">A.T. Field</text>
<text x="81" y="333" class="muted" font-size="15" font-weight="550" >Content, community and an independent web platform.</text>
<rect x="81" y="357" width="154" height="29" rx="15" class="pill" /><text x="93" y="376" class="muted" font-size="12" font-weight="650" >React · TypeScript</text><rect x="246" y="357" width="115" height="29" rx="15" class="pill" /><text x="258" y="376" class="muted" font-size="12" font-weight="650" >Cloudflare</text>
<rect x="81" y="414" width="302" height="37" rx="11" class="brand-bg" /><text x="100" y="439" class="brand-on" font-size="13" font-weight="735" >OPEN PRODUCT</text>
<rect x="495" y="244" width="301" height="201" rx="15" class="subtle" /><text x="516" y="276" class="brand-ink" font-size="15" font-weight="760" >A.T. FIELD</text><text x="516" y="309" class="ink" font-size="24" font-weight="750" >Explore what matters.</text>
