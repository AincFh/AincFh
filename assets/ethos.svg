<text x="349" y="191" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="13" font-weight="780" fill="#B9ACE9">02</text>
<text x="349" y="235" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="19" font-weight="755" fill="#F1F3FA">Reliable systems</text>
<text x="349" y="263" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="13" font-weight="550" fill="#BFCDE0">Thoughtful states and</text>
