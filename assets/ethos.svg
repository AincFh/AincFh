<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="AincFh working principles: visual clarity, reliable behavior and verified product delivery with human-reviewed AI tooling">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101522"/><stop offset=".55" stop-color="#182135"/><stop offset="1" stop-color="#111727"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2=".4"><stop stop-color="#ffad53"/><stop offset=".5" stop-color="#fd816b"/><stop offset="1" stop-color="#a481f4"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#253047"/><stop offset="1" stop-color="#192336"/></linearGradient>
<radialGradient id="light"><stop stop-color="#995be6" stop-opacity=".24"/><stop offset="1" stop-color="#995be6" stop-opacity="0"/></radialGradient>
<radialGradient id="warm"><stop stop-color="#f29447" stop-opacity=".14"/><stop offset="1" stop-color="#f29447" stop-opacity="0"/></radialGradient>
<pattern id="hex" width="86" height="74" patternUnits="userSpaceOnUse"><path d="M21 1 42 13v25L21 50 0 38V13ZM64 38 85 50v24L64 86 43 74V50Z" fill="none" stroke="#ffa455" stroke-opacity=".09" stroke-width="1"/></pattern>
</defs>
<g font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
<rect x="0" y="0" width="900" height="400" rx="0" fill="url(#bg)" stroke="none" stroke-width="1"/><rect x="0" y="0" width="900" height="400" rx="0" fill="url(#hex)" stroke="none" stroke-width="1"/>
<ellipse cx="800" cy="45" rx="345" ry="240" fill="url(#light)"/>
<ellipse cx="85" cy="340" rx="250" ry="200" fill="url(#warm)"/>
<rect x="18" y="18" width="864" height="364" rx="12" fill="none" stroke="#3a4059" stroke-width="1"/>
<path d="M38 35h24M38 35v23 M838 365h24v-23" fill="none" stroke="#b78afb" stroke-width="2"/>
<path d="M18 380H882" stroke="url(#accent)" stroke-width="3"/>
<text x="50" y="64" fill="#ffb16b" font-size="11" font-weight="790" letter-spacing="1.5">ENGINEERING PHILOSOPHY  /  HOW I WORK</text><text x="48" y="105" fill="#f4f4fa" font-size="31" font-weight="820" >Keep the product coherent.</text><rect x="46" y="136" width="262" height="193" rx="12" fill="#1b283e" stroke="#3d4b64" stroke-width="1"/><text x="65" y="166" fill="#ffb367" font-size="12" font-weight="780" >01</text><rect x="258" y="152" width="28" height="25" rx="7" fill="#293952" stroke="#4b5c79" stroke-width="1"/><text x="267" y="170" fill="#c9a6ff" font-size="16" font-weight="780" >◆</text><text x="65" y="214" fill="#f4f5fa" font-size="20" font-weight="770" >Visual clarity</text><text x="65" y="246" fill="#b5c4d8" font-size="11.5" font-weight="500" >Interfaces should feel like one</text><text x="65" y="264" fill="#b5c4d8" font-size="11.5" font-weight="500" >system, on every screen and theme.</text><path d="M66 288H286" stroke="#37435d" stroke-width="1"/><text x="66" y="309" fill="#8e9db9" font-size="9" font-weight="790" letter-spacing="1.7">DESIGN</text><rect x="324" y="136" width="262" height="193" rx="12" fill="#1b283e" stroke="#3d4b64" stroke-width="1"/><text x="343" y="166" fill="#ffb367" font-size="12" font-weight="780" >02</text><rect x="536" y="152" width="28" height="25" rx="7" fill="#293952" stroke="#4b5c79" stroke-width="1"/><text x="545" y="170" fill="#c9a6ff" font-size="16" font-weight="780" >✓</text><text x="343" y="214" fill="#f4f5fa" font-size="20" font-weight="770" >Reliable behavior</text><text x="343" y="246" fill="#b5c4d8" font-size="11.5" font-weight="500" >Permission checks, persistence</text><text x="343" y="264" fill="#b5c4d8" font-size="11.5" font-weight="500" >and error states must be deliberate.</text><path d="M344 288H564" stroke="#37435d" stroke-width="1"/><text x="344" y="309" fill="#8e9db9" font-size="9" font-weight="790" letter-spacing="1.7">ENGINEERING</text><rect x="602" y="136" width="262" height="193" rx="12" fill="#1b283e" stroke="#3d4b64" stroke-width="1"/><text x="621" y="166" fill="#ffb367" font-size="12" font-weight="780" >03</text><rect x="814" y="152" width="28" height="25" rx="7" fill="#293952" stroke="#4b5c79" stroke-width="1"/><text x="823" y="170" fill="#c9a6ff" font-size="16" font-weight="780" >↗</text><text x="621" y="214" fill="#f4f5fa" font-size="20" font-weight="770" >Verifiable delivery</text><text x="621" y="246" fill="#b5c4d8" font-size="11.5" font-weight="500" >Test actual workflows, expose</text><text x="621" y="264" fill="#b5c4d8" font-size="11.5" font-weight="500" >limits and fix broken paths.</text><path d="M622 288H842" stroke="#37435d" stroke-width="1"/><text x="622" y="309" fill="#8e9db9" font-size="9" font-weight="790" letter-spacing="1.7">QUALITY</text><text x="52" y="365" fill="#9db0ca" font-size="12" font-weight="520" >AI can accelerate iteration. Decisions, validation and responsibility still matter.</text>
</g></svg>