<rect x="349" y="305" width="218" height="3" rx="2" fill="#B9ACE9" stroke="none" class="shine"/><rect x="613" y="157" width="254" height="168" rx="14" fill="#1E2F47" stroke="#3C4E67"/>
<text x="631" y="191" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="13" font-weight="780" fill="#89DAC1">03</text>
<text x="631" y="235" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="19" font-weight="755" fill="#F1F3FA">Verified delivery</text>
<text x="631" y="263" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="13" font-weight="550" fill="#BFCDE0">Test the real workflow</text>
