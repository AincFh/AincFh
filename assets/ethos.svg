<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 265" width="900" height="265" role="img" aria-label="Three guiding principles: visual clarity, reliable systems and verified delivery.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2C3B4F"/><stop offset=".56" stop-color="#35465C"/><stop offset="1" stop-color="#2B394C"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2=".4"><stop stop-color="#A9C8F1"/><stop offset=".62" stop-color="#CDBCF0"/><stop offset="1" stop-color="#F2C5AB"/></linearGradient>
<linearGradient id="icon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#B6D0F5"/><stop offset=".57" stop-color="#B8BFF0"/><stop offset="1" stop-color="#D8BDE4"/></linearGradient>
<linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#43546D"/><stop offset="1" stop-color="#3A4C64"/></linearGradient>
<style><![CDATA[
:root{color-scheme:dark}
.breathe{animation:breathe 11s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.72}50%{opacity:1}}
.draw{animation:draw 13s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
@keyframes draw{0%,100%{transform:scaleX(.20);opacity:.55}60%{transform:scaleX(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.breathe,.draw{animation:none!important;transform:none!important}}
]]></style>
</defs>
<rect x="0" y="0" width="900" height="265" rx="0" fill="url(#bg)" stroke="none"/>

<text x="54" y="43" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="12" font-weight="740" fill="#A9C8F1" letter-spacing="2">APPROACH</text>
<text x="53" y="94" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="33" font-weight="765" fill="#F5F7FC" letter-spacing="-1.1">Calm outside. Capable inside.</text>
<text x="54" y="123" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="16" font-weight="500" fill="#C8D5E5" >Good engineering should feel effortless to use.</text>
<path d="M54 162H846" stroke="#71849B" stroke-width="1" fill="none" />
<path d="M320 176V230" stroke="#71849B" stroke-width="1" fill="none" />
<path d="M582 176V230" stroke="#71849B" stroke-width="1" fill="none" />
<text x="56" y="190" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="12" font-weight="725" fill="#A9C8F1" >01  /  DESIGN</text>
<text x="56" y="220" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="20" font-weight="710" fill="#F5F7FC" >Visual clarity</text>
<text x="345" y="190" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="12" font-weight="725" fill="#CDBCF0" >02  /  ENGINEERING</text>
<text x="345" y="220" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="20" font-weight="710" fill="#F5F7FC" >Reliable systems</text>
<text x="608" y="190" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="12" font-weight="725" fill="#9CDECC" >03  /  QUALITY</text>
<text x="608" y="220" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="20" font-weight="710" fill="#F5F7FC" >Verified delivery</text>
<rect x="54" y="246" width="792" height="2" rx="1" fill="#617791" stroke="none"/>
<rect x="54" y="246" width="792" height="2" rx="1" fill="url(#accent)" stroke="none" class="draw"/>

</svg>