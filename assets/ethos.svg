<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="AincFh design principles: visual clarity, reliable systems and verified delivery, shown in three minimal cards"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101727"/><stop offset=".55" stop-color="#192238"/><stop offset="1" stop-color="#111a2c"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2=".4"><stop stop-color="#ffb66b"/><stop offset=".5" stop-color="#df8b99"/><stop offset="1" stop-color="#aa95f0"/></linearGradient>
<radialGradient id="aura"><stop stop-color="#8f79d7" stop-opacity=".20"/><stop offset="1" stop-color="#8f79d7" stop-opacity="0"/></radialGradient>
<radialGradient id="warm"><stop stop-color="#f29a5c" stop-opacity=".12"/><stop offset="1" stop-color="#f29a5c" stop-opacity="0"/></radialGradient>
</defs><style><![CDATA[
.breathe{animation:breathe 11s ease-in-out infinite alternate;transform-origin:center}
@keyframes breathe{from{opacity:.53}to{opacity:1}}
.float{animation:float 8s ease-in-out infinite alternate}
@keyframes float{to{transform:translateY(-5px)}}
.soft-pulse{animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{opacity:.38}}
.scan{animation:scan 12s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:left center}
@keyframes scan{to{transform:scaleX(.55)}}
.shine{animation:shine 14s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:left center}
@keyframes shine{to{opacity:.5;transform:scaleX(.72)}}

@media(prefers-reduced-motion:reduce){.breathe,.float,.scan,.shine,.soft-pulse,.card-a,.card-b{animation:none!important;transform:none!important}}
]]></style>
<rect x="0" y="0" width="900" height="360" rx="0" fill="url(#bg)" stroke="none"/>
<ellipse class="breathe" cx="780" cy="42" rx="280" ry="230" fill="url(#aura)"/>
<ellipse class="breathe" cx="80" cy="335" rx="195" ry="145" fill="url(#warm)"/>
<path d="M38 27h26 M38 27v22 M835 333h26v-22" fill="none" stroke="#776f9a" stroke-width="1.6" opacity=".65"/>

<text x="49" y="53" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="12" font-weight="790" fill="#FFBD78" letter-spacing="1.7">HOW I WORK</text>
<text x="48" y="103" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="31" font-weight="810" fill="#F5F5FC">Calm on the surface. Solid underneath.</text>
<text x="49" y="129" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="14" font-weight="535" fill="#ABBBD2">Three principles guide the work — without unnecessary complexity.</text>
<rect x="49" y="157" width="254" height="168" rx="14" fill="#1D2B42" stroke="#41516B"/>
<text x="67" y="191" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="13" font-weight="780" fill="#FFBD7B">01</text>
<text x="67" y="235" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="19" font-weight="755" fill="#F1F3FA">Visual clarity</text>
<text x="67" y="263" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="13" font-weight="550" fill="#B4C3D8">A coherent interface</text>
<text x="67" y="282" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="13" font-weight="550" fill="#B4C3D8">on every screen.</text>
<rect x="67" y="305" width="218" height="3" rx="2" fill="#35465F" stroke="none"/>
<rect x="67" y="305" width="218" height="3" rx="2" fill="#FFBD7B" stroke="none" class="shine"/><rect x="331" y="157" width="254" height="168" rx="14" fill="#1D2B42" stroke="#41516B"/>
<text x="349" y="191" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="13" font-weight="780" fill="#C6B0FF">02</text>
<text x="349" y="235" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="19" font-weight="755" fill="#F1F3FA">Reliable systems</text>
<text x="349" y="263" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="13" font-weight="550" fill="#B4C3D8">Thoughtful states and</text>
<text x="349" y="282" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="13" font-weight="550" fill="#B4C3D8">permission boundaries.</text>
<rect x="349" y="305" width="218" height="3" rx="2" fill="#35465F" stroke="none"/>
<rect x="349" y="305" width="218" height="3" rx="2" fill="#C6B0FF" stroke="none" class="shine"/><rect x="613" y="157" width="254" height="168" rx="14" fill="#1D2B42" stroke="#41516B"/>
<text x="631" y="191" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="13" font-weight="780" fill="#83E6C7">03</text>
<text x="631" y="235" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="19" font-weight="755" fill="#F1F3FA">Verified delivery</text>
<text x="631" y="263" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="13" font-weight="550" fill="#B4C3D8">Test the real workflow</text>
<text x="631" y="282" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="13" font-weight="550" fill="#B4C3D8">before shipping.</text>
<rect x="631" y="305" width="218" height="3" rx="2" fill="#35465F" stroke="none"/>
<rect x="631" y="305" width="218" height="3" rx="2" fill="#83E6C7" stroke="none" class="shine"/></svg>