<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="How I work — AI-augmented, human-reviewed">
<defs>
<style>
:root{--bg:#fafafa;--ink:#111111;--sub:#64748b;--dim:#94a3b8;--hexl:rgba(255,159,67,.26);--brk:#8b5cf6;--line:rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#1c1f2b;--ink:#f1f5f9;--sub:#94a3b8;--dim:#7c8ba3;--hexl:rgba(255,159,67,.17);--brk:#a78bfa;--line:rgba(255,255,255,.10)}}
.bg{fill:var(--bg)}.ink{fill:var(--ink)}.sub{fill:var(--sub)}.dim{fill:var(--dim)}
.hx{stroke:var(--hexl);fill:none;stroke-width:1}
.brk{stroke:var(--brk);fill:none;stroke-width:2}
.ln{stroke:var(--line);stroke-width:1}
.dsp{font-family:'Orbitron','Rajdhani','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
.txt{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif}
</style>
<linearGradient id="at" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FF9F43"/><stop offset="100%" stop-color="#FF6B6B"/></linearGradient>
<radialGradient id="o1"><stop offset="0%" stop-color="#8B5CF6" stop-opacity=".24"/><stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
<radialGradient id="o2"><stop offset="0%" stop-color="#FF9F43" stop-opacity=".26"/><stop offset="100%" stop-color="#FF9F43" stop-opacity="0"/></radialGradient>
<radialGradient id="mg" cx="6%" cy="50%" r="56%"><stop offset="0%" stop-color="#fff" stop-opacity="1"/><stop offset="50%" stop-color="#fff" stop-opacity=".4"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient>
<mask id="lm"><rect width="900" height="420" fill="url(#mg)"/></mask>
<pattern id="hexp" width="60" height="105" patternUnits="userSpaceOnUse">
<path class="hx" d="M30,0 L60,17.5 L60,52.5 L30,70 L0,52.5 L0,17.5 Z"/>
<path class="hx" d="M60,52.5 L90,70 L90,105 L60,122.5 L30,105 L30,70 Z"/>
<path class="hx" d="M0,52.5 L30,70 L30,105 L0,122.5 L-30,105 L-30,70 Z"/>
<path class="hx" d="M60,-52.5 L90,-35 L90,0 L60,17.5 L30,0 L30,-35 Z"/>
<path class="hx" d="M0,-52.5 L30,-35 L30,0 L0,17.5 L-30,0 L-30,-35 Z"/>
</pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect y="2" width="4" height="2" fill="#000" opacity=".2"/></pattern>
<filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
</defs>

<rect class="bg" width="900" height="420"/>

<ellipse cx="70" cy="120" rx="300" ry="220" fill="url(#o1)" opacity=".65">
<animate attributeName="rx" values="300;330;300" dur="10s" repeatCount="indefinite"/>
<animate attributeName="opacity" values=".65;.85;.65" dur="10s" repeatCount="indefinite"/>
</ellipse>
<ellipse cx="840" cy="380" rx="280" ry="210" fill="url(#o2)" opacity=".6">
<animate attributeName="rx" values="280;310;280" dur="8s" begin="2s" repeatCount="indefinite"/>
<animate attributeName="opacity" values=".6;.82;.6" dur="8s" begin="2s" repeatCount="indefinite"/>
</ellipse>

<rect width="900" height="420" fill="url(#hexp)" mask="url(#lm)"/>

<path d="M-150,210 L-75,80 L75,80 L150,210 L75,340 L-75,340 Z" fill="none" stroke="url(#at)" stroke-width="1.5" stroke-linejoin="round" opacity=".14">
<animate attributeName="opacity" values=".14;.26;.14" dur="12s" repeatCount="indefinite"/>
</path>

<text class="txt dim" x="60" y="48" font-size="10.5" font-weight="700" letter-spacing="3">A.T. FIELD  //  HOW I WORK</text>

<g opacity="0">
<animate attributeName="opacity" from="0" to="1" dur=".9s" begin=".15s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" from="0 16" to="0 0" dur="1.1s" begin=".15s" calcMode="spline" keySplines=".2 .8 .2 1" fill="freeze"/>

<g class="txt ink" font-size="14">
<text x="60" y="88">I use AI heavily to write code. What I own is the part that does not autocomplete:</text>
<text x="60" y="110">choosing D1 over a hosted database because the free tier and edge locality actually</text>
<text x="60" y="132">matter, deciding what ships, and debugging production when it breaks at 2am.</text>
</g>
<g class="txt sub" font-size="13">
<text x="60" y="172">I am nineteen, I came into this from art and design, and my weak spot is depth in the</text>
<text x="60" y="194">layer underneath what I build. I know exactly where those gaps are — closing them</text>
<text x="60" y="216">is why I want to be on a team.</text>
</g>

<line class="ln" x1="60" y1="254" x2="840" y2="254"/>
</g>

<g opacity="0">
<animate attributeName="opacity" from="0" to="1" dur=".8s" begin=".5s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" from="0 16" to="0 0" dur="1s" begin=".5s" calcMode="spline" keySplines=".2 .8 .2 1" fill="freeze"/>

<text class="txt" x="60" y="288" font-size="10" font-weight="700" letter-spacing="2.4" fill="#FF9F43">PRINCIPLES  ·  三条自己定的规矩</text>

<g fill="#FF9F43" opacity=".85">
<path d="M60,320 L62.8,315 L68.2,315 L71,320 L68.2,325 L62.8,325 Z"/>
<path d="M60,348 L62.8,343 L68.2,343 L71,348 L68.2,353 L62.8,353 Z"/>
<path d="M60,376 L62.8,371 L68.2,371 L71,376 L68.2,381 L62.8,381 Z"/>
</g>
<g class="txt ink" font-size="13.5" opacity=".92">
<text x="86" y="325">只用深色模式开发，白色主题是写给访客看的</text>
<text x="86" y="353">零依赖优先：原生能实现的就不装包</text>
<text x="86" y="381">每个 App 必须能在飞行模式下完整运行</text>
</g>
<g class="txt dim" font-size="11" text-anchor="end">
<text x="840" y="325">Dark mode is the build target</text>
<text x="840" y="353">No package if the platform already does it</text>
<text x="840" y="381">Everything must survive airplane mode</text>
</g>
</g>

<g class="brk">
<path d="M16,30 L16,16 L30,16"/>
<path d="M870,16 L884,16 L884,30"/>
<path d="M16,390 L16,404 L30,404"/>
<path d="M870,404 L884,404 L884,390"/>
</g>

<rect width="900" height="420" fill="url(#scan)" opacity=".1"/>
<rect width="900" height="420" filter="url(#noise)" opacity=".03"/>
</svg>
