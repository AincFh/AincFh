<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="AincFh design principles: visual clarity, reliable systems and verified delivery, shown in three minimal cards"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2C3B4F"/><stop offset=".56" stop-color="#35465C"/><stop offset="1" stop-color="#2B394C"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2=".4"><stop stop-color="#A9C8F1"/><stop offset=".52" stop-color="#CDBCF0"/><stop offset="1" stop-color="#F2C5AB"/></linearGradient>
<radialGradient id="aura"><stop stop-color="#91A8D9" stop-opacity=".15"/><stop offset="1" stop-color="#91A8D9" stop-opacity="0"/></radialGradient>
<radialGradient id="warm"><stop stop-color="#F2C5AB" stop-opacity=".12"/><stop offset="1" stop-color="#F2C5AB" stop-opacity="0"/></radialGradient>
</defs><style><![CDATA[
.breathe{animation:breathe 11s ease-in-out infinite alternate;transform-origin:center}
@keyframes breathe{from{opacity:.53}to{opacity:1}}
.float{animation:float 8s ease-in-out infinite alternate}
@keyframes float{to{transform:translateY(-5px)}}
.soft-pulse{animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{opacity:.38}}
.scan{animation:scan 12s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:left center}
@keyframes scan{to{transform:scaleX(.55)}}
.shine{animation:shine 14s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:left center}
@keyframes shine{to{opacity:.5;transform:scaleX(.72)}}

@media(prefers-reduced-motion:reduce){.breathe,.float,.scan,.shine,.soft-pulse,.card-a,.card-b{animation:none!important;transform:none!important}}
]]></style>
<rect x="0" y="0" width="900" height="360" rx="0" fill="url(#bg)" stroke="none"/>
<ellipse class="breathe" cx="780" cy="42" rx="280" ry="230" fill="url(#aura)"/>
<ellipse class="breathe" cx="80" cy="335" rx="195" ry="145" fill="url(#warm)"/>


<text x="49" y="53" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="12" font-weight="790" fill="#F2C5AB" letter-spacing="1.7">HOW I WORK</text>
<text x="48" y="103" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="31" font-weight="810" fill="#F5F5FC">Calm on the surface. Solid underneath.</text>
<text x="49" y="129" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="14" font-weight="535" fill="#C8D5E5">Three principles guide the work — without unnecessary complexity.</text>
<rect x="49" y="157" width="254" height="168" rx="14" fill="#3B4D64" stroke="#6A7D96"/>
<text x="67" y="191" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="13" font-weight="780" fill="#F2C5AB">01</text>
<text x="67" y="235" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="19" font-weight="755" fill="#F5F7FC">Visual clarity</text>
<text x="67" y="263" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="13" font-weight="550" fill="#C8D5E5">A coherent interface</text>
<text x="67" y="282" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="13" font-weight="550" fill="#C8D5E5">on every screen.</text>
<rect x="67" y="305" width="218" height="3" rx="2" fill="#35465F" stroke="none"/>
<rect x="67" y="305" width="218" height="3" rx="2" fill="#F2C5AB" stroke="none" class="shine"/><rect x="331" y="157" width="254" height="168" rx="14" fill="#3B4D64" stroke="#6A7D96"/>
<text x="349" y="191" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="13" font-weight="780" fill="#CDBCF0">02</text>
<text x="349" y="235" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="19" font-weight="755" fill="#F5F7FC">Reliable systems</text>
<text x="349" y="263" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="13" font-weight="550" fill="#C8D5E5">Thoughtful states and</text>
<text x="349" y="282" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="13" font-weight="550" fill="#C8D5E5">permission boundaries.</text>
<rect x="349" y="305" width="218" height="3" rx="2" fill="#35465F" stroke="none"/>
<rect x="349" y="305" width="218" height="3" rx="2" fill="#CDBCF0" stroke="none" class="shine"/><rect x="613" y="157" width="254" height="168" rx="14" fill="#3B4D64" stroke="#6A7D96"/>
<text x="631" y="191" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="13" font-weight="780" fill="#9CDECC">03</text>
<text x="631" y="235" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="19" font-weight="755" fill="#F5F7FC">Verified delivery</text>
<text x="631" y="263" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="13" font-weight="550" fill="#C8D5E5">Test the real workflow</text>
<text x="631" y="282" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC',Arial,sans-serif" font-size="13" font-weight="550" fill="#C8D5E5">before shipping.</text>
<rect x="631" y="305" width="218" height="3" rx="2" fill="#35465F" stroke="none"/>
<rect x="631" y="305" width="218" height="3" rx="2" fill="#9CDECC" stroke="none" class="shine"/></svg>