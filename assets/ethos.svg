<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="AincFh working principles: visual clarity, reliable behavior and verified product delivery with human-reviewed AI tooling">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101522"/><stop offset=".55" stop-color="#182135"/><stop offset="1" stop-color="#111727"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2=".4"><stop stop-color="#ffad53"/><stop offset=".5" stop-color="#fd816b"/><stop offset="1" stop-color="#a481f4"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#253047"/><stop offset="1" stop-color="#192336"/></linearGradient>
<radialGradient id="light"><stop stop-color="#995be6" stop-opacity=".24"/><stop offset="1" stop-color="#995be6" stop-opacity="0"/></radialGradient>
<radialGradient id="warm"><stop stop-color="#f29447" stop-opacity=".14"/><stop offset="1" stop-color="#f29447" stop-opacity="0"/></radialGradient>
<pattern id="hex" width="86" height="74" patternUnits="userSpaceOnUse"><path d="M21 1 42 13v25L21 50 0 38V13ZM64 38 85 50v24L64 86 43 74V50Z" fill="none" stroke="#ffa455" stroke-opacity=".09" stroke-width="1"/></pattern>
<style><![CDATA[
/* Motion system 15.0: readable at every frame; pure CSS in embedded SVG. */
.af-halo{animation:af-halo 14s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.af-scan-line{animation:af-scan 9s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.af-led{animation:af-led 2.5s ease-in-out infinite}
.af-float{animation:af-float 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.af-title{animation:af-title 11s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.af-card{transform-box:fill-box;transform-origin:center;animation:af-card 12s ease-in-out infinite}
.af-card-1{animation-delay:0s}.af-card-2{animation-delay:-4s}.af-card-3{animation-delay:-8s}
.af-underline{animation:af-underline 12s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.af-blink{animation:af-blink 2.8s ease-in-out infinite}
.af-comet{animation:af-comet 11s linear infinite}
@keyframes af-halo{0%{opacity:.12;transform:translate(-24px,5px) scale(.96)}50%{opacity:.35}100%{opacity:.15;transform:translate(24px,-8px) scale(1.09)}}
@keyframes af-scan{0%,8%{transform:scaleX(.08);opacity:.30}65%{transform:scaleX(1);opacity:.88}88%,100%{transform:scaleX(.08);opacity:.3}}
@keyframes af-led{0%,100%{opacity:.48}50%{opacity:1}}
@keyframes af-float{0%,100%{transform:translateY(0px)}45%,60%{transform:translateY(-4px)}}
@keyframes af-title{0%,100%{opacity:1;transform:translateY(0)}6%{opacity:.75;transform:translateY(3px)}15%,94%{opacity:1;transform:translateY(0)}}
@keyframes af-card{0%,100%{transform:translateY(0);opacity:1}13%,28%{transform:translateY(-4px);opacity:1}35%{transform:translateY(0);opacity:1}}
@keyframes af-underline{0%,100%{transform:scaleX(.15);opacity:.45}45%{transform:scaleX(1);opacity:1}85%{transform:scaleX(.25);opacity:.6}}
@keyframes af-blink{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes af-comet{0%{transform:translateX(0);opacity:0}8%{opacity:1}90%{opacity:1}100%{transform:translateX(760px);opacity:0}}
@media(prefers-reduced-motion:reduce){.af-halo,.af-scan-line,.af-led,.af-float,.af-title,.af-card,.af-underline,.af-blink,.af-comet{animation:none!important;transform:none!important}}
]]></style>
</defs>
<g font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
<rect x="0" y="0" width="900" height="400" rx="0" fill="url(#bg)" stroke="none" stroke-width="1"/><rect x="0" y="0" width="900" height="400" rx="0" fill="url(#hex)" stroke="none" stroke-width="1"/>
<ellipse cx="800" cy="45" rx="345" ry="240" fill="url(#light)"/>
<ellipse cx="85" cy="340" rx="250" ry="200" fill="url(#warm)"/>
<g aria-hidden="true"><ellipse class="af-halo" cx="730" cy="124" rx="155" ry="95" fill="#9b82ed" opacity=".11"/><ellipse class="af-halo" cx="110" cy="280" rx="115" ry="110" fill="#fa965a" opacity=".10"/></g>

<rect x="18" y="18" width="864" height="364" rx="12" fill="none" stroke="#3a4059" stroke-width="1"/>
<path d="M38 35h24M38 35v23 M838 365h24v-23" fill="none" stroke="#b78afb" stroke-width="2"/>
<path class="af-blink" d="M18 380H882" stroke="url(#accent)" stroke-width="3"/>
<text x="50" y="64" fill="#ffb16b" font-size="11" font-weight="790" letter-spacing="1.5">ENGINEERING PHILOSOPHY  /  HOW I WORK</text><text class="af-title" x="48" y="105" fill="#f4f4fa" font-size="31" font-weight="820" >Keep the product coherent.</text><g class="af-card af-card-1"><rect x="46" y="136" width="262" height="193" rx="12" fill="#1b283e" stroke="#3d4b64" stroke-width="1"/><text x="65" y="166" fill="#ffb367" font-size="12" font-weight="780" >01</text><rect x="258" y="152" width="28" height="25" rx="7" fill="#293952" stroke="#4b5c79" stroke-width="1"/><text x="267" y="170" fill="#c9a6ff" font-size="16" font-weight="780" >◆</text><text x="65" y="214" fill="#f4f5fa" font-size="20" font-weight="770" >Visual clarity</text><text x="65" y="246" fill="#b5c4d8" font-size="11.5" font-weight="500" >Interfaces should feel like one</text><text x="65" y="264" fill="#b5c4d8" font-size="11.5" font-weight="500" >system, on every screen and theme.</text><path d="M66 288H286" stroke="#37435d" stroke-width="1"/><text x="66" y="309" fill="#8e9db9" font-size="9" font-weight="790" letter-spacing="1.7">DESIGN</text></g><g class="af-card af-card-2"><rect x="324" y="136" width="262" height="193" rx="12" fill="#1b283e" stroke="#3d4b64" stroke-width="1"/><text x="343" y="166" fill="#ffb367" font-size="12" font-weight="780" >02</text><rect x="536" y="152" width="28" height="25" rx="7" fill="#293952" stroke="#4b5c79" stroke-width="1"/><text x="545" y="170" fill="#c9a6ff" font-size="16" font-weight="780" >✓</text><text x="343" y="214" fill="#f4f5fa" font-size="20" font-weight="770" >Reliable behavior</text><text x="343" y="246" fill="#b5c4d8" font-size="11.5" font-weight="500" >Permission checks, persistence</text><text x="343" y="264" fill="#b5c4d8" font-size="11.5" font-weight="500" >and error states must be deliberate.</text><path d="M344 288H564" stroke="#37435d" stroke-width="1"/><text x="344" y="309" fill="#8e9db9" font-size="9" font-weight="790" letter-spacing="1.7">ENGINEERING</text></g><g class="af-card af-card-3"><rect x="602" y="136" width="262" height="193" rx="12" fill="#1b283e" stroke="#3d4b64" stroke-width="1"/><text x="621" y="166" fill="#ffb367" font-size="12" font-weight="780" >03</text><rect x="814" y="152" width="28" height="25" rx="7" fill="#293952" stroke="#4b5c79" stroke-width="1"/><text x="823" y="170" fill="#c9a6ff" font-size="16" font-weight="780" >↗</text><text x="621" y="214" fill="#f4f5fa" font-size="20" font-weight="770" >Verifiable delivery</text><text x="621" y="246" fill="#b5c4d8" font-size="11.5" font-weight="500" >Test actual workflows, expose</text><text x="621" y="264" fill="#b5c4d8" font-size="11.5" font-weight="500" >limits and fix broken paths.</text><path d="M622 288H842" stroke="#37435d" stroke-width="1"/><text x="622" y="309" fill="#8e9db9" font-size="9" font-weight="790" letter-spacing="1.7">QUALITY</text></g><rect x="50" y="340" width="798" height="2" rx="1" fill="#354462"/><rect class="af-scan-line" x="50" y="340" width="798" height="2" rx="1" fill="url(#accent)"/><text x="52" y="365" fill="#9db0ca" font-size="12" font-weight="520" >AI can accelerate iteration. Decisions, validation and responsibility still matter.</text>
</g></svg>