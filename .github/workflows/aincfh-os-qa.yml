name: AincFh OS — Browser QA

on:
  push:
    branches:
      - profile-refresh-2026-11
    paths:
      - 'docs/**'
      - 'assets/launch-workspace.svg'
      - 'tests/os-smoke.py'
      - 'tests/os-apps-v8.py'
      - 'tests/os-paint-v9.py'
      - 'tests/os-session-v9.py'
      - 'tests/os-shell-v10.py'
      - 'tests/os-performance-v11.py'
      - 'tests/os-control-center-v11.py'
      - 'tests/os-fusion-v12.py'
      - 'tests/os-desktop-v13.py'
      - '.github/workflows/aincfh-os-qa.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'assets/launch-workspace.svg'
      - 'tests/os-smoke.py'
      - 'tests/os-apps-v8.py'
      - 'tests/os-paint-v9.py'
      - 'tests/os-session-v9.py'
      - 'tests/os-shell-v10.py'
      - 'tests/os-performance-v11.py'
      - 'tests/os-control-center-v11.py'
      - 'tests/os-fusion-v12.py'
      - 'tests/os-desktop-v13.py'
      - '.github/workflows/aincfh-os-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    name: Viewport + interaction regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Serve local OS
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory docs > /tmp/aincfh-os-server.log 2>&1 &
          echo $! > /tmp/aincfh-os-server.pid
          sleep 2
      - name: Run browser smoke tests
        env:
          OS_URL: http://127.0.0.1:8765/
        run: |
          python tests/os-smoke.py
          python tests/os-apps-v8.py
          python tests/os-paint-v9.py
          python tests/os-session-v9.py
          python tests/os-shell-v10.py
          python tests/os-performance-v11.py
          python tests/os-control-center-v11.py
          python tests/os-fusion-v12.py
          python tests/os-desktop-v13.py

      - name: Upload visual regression screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aincfh-os-paint-viewport-previews
          path: test-results/*.png
          if-no-files-found: ignore
          retention-days: 7
