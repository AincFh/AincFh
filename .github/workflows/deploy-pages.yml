name: Publish AincFh OS to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aincfh-os-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify build output
        run: |
          test -s docs/index.html
          test -s docs/manifest.webmanifest
          test -s docs/sw.js
      - name: Verify Pages has been enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          response=$(curl --silent --show-error --output /tmp/aincfh-pages.json --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$response" != "200" ]; then
            echo "::error::GitHub Pages is not enabled. Go to Settings > Pages > Build and deployment > Source = GitHub Actions. Then rerun this workflow."
            exit 1
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static OS
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy static OS
        id: deployment
        uses: actions/deploy-pages@v4
